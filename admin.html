  <script type="module">
    const CONFIG = window.YP_CONFIG || {};
    const app = document.getElementById("app");
    const who = document.getElementById("who");
    const photoDlg = document.getElementById("photo");
    photoDlg.querySelector("button").onclick = () => photoDlg.close();
    photoDlg.onclick = e => { if (e.target === photoDlg) photoDlg.close(); };

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const icon = name => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const fmtDate = d => new Date(d).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const ago = d => {
      const m = Math.round((Date.now() - new Date(d)) / 60000);
      if (m < 1) return "just now";
      if (m < 60) return m + " min ago";
      const h = Math.round(m / 60);
      if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
      const days = Math.round(h / 24);
      return days + (days === 1 ? " day ago" : " days ago");
    };

    if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) {
      app.innerHTML = `<div class="card notice"><h2>Not connected yet</h2>
        <p>Add your Supabase URL and key to <code>config.js</code>, then reload this page.</p></div>`;
      throw new Error("Supabase not configured");
    }

    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
    const db = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

    // Squad rules (same as the registration form)
    const MIN_PLAYERS = 10, MAX_PLAYERS = 12, MIN_AGE = 35;
    const ROLES = [
      { role: "manager", label: "Manager", icon: "briefcase" },
      { role: "coach", label: "Coach", icon: "clipboard" },
      { role: "official", label: "Official", icon: "shield" },
      { role: "medic", label: "Medic", icon: "medic" }
    ];
    const roleInfo = r => ROLES.find(x => x.role === (r === "assistant" ? "official" : r)) || { role: r, label: r, icon: "user" };

    let teams = [];
    let settings = { registration_open: true, closed_message: "", closes_at: null, instructions: "" };
    // <input type="datetime-local"> works in local time; the tournament runs on Maldives time (UTC+5)
    const toMvInput = iso => iso ? new Date(new Date(iso).getTime() + 5 * 3600000).toISOString().slice(0, 16) : "";
    const fromMvInput = v => v ? new Date(v + ":00+05:00").toISOString() : null;
    const fmtMv = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }).format(new Date(iso));
    // Closing date being chosen (kept until saved, so re-drawing the page doesn't lose it)
    const mvToday = () => toMvInput(new Date().toISOString()).slice(0, 10);
    let dl = null;
    const dlFromSettings = () => {
      const v = toMvInput(settings.closes_at);
      dl = { date: v.slice(0, 10), time: v.slice(11, 16) || "23:59" };
    };
    const dlIso = () => dl.date && dl.time ? fromMvInput(dl.date + "T" + dl.time) : null;
    function dlState() {
      const iso = dlIso();
      if (!iso) return { cls: "", canSave: false, html: `${icon("calendar")}<span>Pick a day above. ${settings.closes_at ? "" : "No closing date is set now, so registration stays open until you turn it off."}</span>` };
      const when = fmtMv(iso);
      if (new Date(iso) <= Date.now()) return { cls: "bad", canSave: false, html: `${icon("alert")}<span><b>${when}</b> has already passed. Pick a later day or time.</span>` };
      const day = new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", weekday: "long" }).format(new Date(iso));
      const same = !!settings.closes_at && Math.abs(new Date(iso) - new Date(settings.closes_at)) < 60000;
      return { cls: same ? "ok saved" : "ok", canSave: !same,
        html: `${icon(same ? "check-circle" : "clock")}<span>${same ? "Saved: registration" : "Registration will"} close${same ? "s" : ""} on <b>${day} ${when}</b> · in ${timeLeft(iso)}</span>` };
    }

    const timeLeft = iso => {
      const ms = new Date(iso) - Date.now();
      const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
      return d > 0 ? `${d} day${d === 1 ? "" : "s"} ${h} h` : h > 0 ? `${h} h ${m} min` : `${m} min`;
    };
    let filter = "all";
    let sortBy = "newest";
    const openIds = new Set();   // teams the organiser has expanded; kept open across refreshes
    let lastSignature = "";
    let signedIn = false;
    let query = "";
    let lastLoaded = null;

    // ---------- Checks: what's missing or wrong in a team ----------
    function teamChecks(t) {
      const n = t.players.length;
      const young = t.players.filter(p => p.age < MIN_AGE);
      const roles = new Set(t.officials.map(o => o.role === "assistant" ? "official" : o.role));
      const missingRoles = ROLES.filter(r => !roles.has(r.role)).map(r => r.label);
      const people = [...t.officials, ...t.players];
      const missingPhotos = people.filter(p => !p.passport_photo_path || !p.id_photo_path);
      const nums = t.players.map(p => p.jersey_number).filter(v => v !== null && v !== undefined);
      const dupes = [...new Set(nums.filter((v, i) => nums.indexOf(v) !== i))];
      const noNumber = t.players.filter(p => p.jersey_number === null || p.jersey_number === undefined).length;
      const list = [
        { icon: "users", short: "Squad", ok: n >= MIN_PLAYERS && n <= MAX_PLAYERS, title: `${n} players`, detail: n < MIN_PLAYERS ? `Needs at least ${MIN_PLAYERS}` : n > MAX_PLAYERS ? `Maximum is ${MAX_PLAYERS}` : `${MIN_PLAYERS}–${MAX_PLAYERS} allowed` },
        { icon: "calendar", short: "Age", ok: !young.length, title: young.length ? `${young.length} under ${MIN_AGE}` : `All aged ${MIN_AGE}+`, detail: young.length ? young.map(p => p.name).join(", ") : "Age rule met" },
        { icon: "shield", short: "Officials", ok: !missingRoles.length, title: `${ROLES.length - missingRoles.length} of ${ROLES.length} officials`, detail: missingRoles.length ? "Missing: " + missingRoles.join(", ") : "Manager, coach, official, medic" },
        { icon: "portrait", short: "Photos", ok: !missingPhotos.length, title: missingPhotos.length ? `${missingPhotos.length} ${missingPhotos.length === 1 ? "person" : "people"} missing a photo` : "All photos uploaded", detail: missingPhotos.length ? missingPhotos.map(p => p.name).join(", ") : "Passport-size + ID for everyone" },
        { icon: "shirt", short: "Jerseys", ok: !dupes.length && !noNumber, title: dupes.length ? "Same jersey number twice" : noNumber ? `${noNumber} without a number` : "Jersey numbers OK", detail: dupes.length ? "No. " + dupes.join(", ") : noNumber ? "Ask the team for the numbers" : "Every player has their own number" }
      ];
      return { list, issues: list.filter(c => !c.ok).length };
    }

    // ---------- Login ----------
    // A phone number logs in as <960 + number>@phone.ypveterans.com (how those accounts are stored)
    function loginEmail(value) {
      const v = value.trim();
      if (v.includes("@")) return v;
      let digits = v.replace(/\D/g, "");
      if (digits.length === 7) digits = "960" + digits;
      return digits + "@phone.ypveterans.com";
    }
    function showLogin(message = "") {
      who.hidden = true;
      document.body.classList.remove("app-mode");
      document.body.classList.add("login-mode");
      app.innerHTML = `
        <form class="login" id="login">
          <div class="login-crest"><img src="images/yp-logo.jpg" alt="Young Players SC"></div>
          <h2>Organiser Portal</h2>
          <p class="lead-txt">YP Veterans Futsal · registrations and ID photos</p>
          <label for="email">Email or phone number</label>
          <div class="field-glass">${icon("user")}<input id="email" type="text" inputmode="email" autocapitalize="off" spellcheck="false" autocomplete="username" placeholder="you@example.com or 7XX XXXX" required></div>
          <label for="password">Password</label>
          <div class="field-glass">${icon("lock")}<input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="eye" id="eye" aria-label="Show password">${icon("eye")}</button></div>
          <button class="primary-btn" type="submit">Log in</button>
          <p class="form-error" id="login-error" role="alert">${esc(message)}</p>
          <a class="back-link" href="./">← Back to the website</a>
          <button type="button" class="install-btn" data-install hidden>${icon("download")} Install app</button>
        </form>`;
      const form = document.getElementById("login");
      // The glass catches the light where the pointer is
      form.onpointermove = e => {
        const r = form.getBoundingClientRect();
        form.style.setProperty("--mx", (e.clientX - r.left) + "px");
        form.style.setProperty("--my", (e.clientY - r.top) + "px");
      };
      const eye = document.getElementById("eye");
      eye.onclick = () => {
        const shown = form.password.type === "text";
        form.password.type = shown ? "password" : "text";
        eye.setAttribute("aria-label", shown ? "Show password" : "Hide password");
        eye.innerHTML = icon(shown ? "eye" : "eye-off");
      };
      form.onsubmit = async e => {
        e.preventDefault();
        const btn = form.querySelector(".primary-btn");
        btn.disabled = true;
        btn.textContent = "Logging in…";
        const { error } = await db.auth.signInWithPassword({
          email: loginEmail(form.email.value),
          password: form.password.value
        });
        btn.disabled = false;
        btn.textContent = "Log in";
        if (error) {
          document.getElementById("login-error").textContent = "Wrong email, phone number or password.";
          form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        }
        else start();
      };
    }

    document.getElementById("logout").onclick = async () => { signedIn = false; await db.auth.signOut(); showLogin(); };

    // ---------- Load data ----------
    async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return showLogin();
      document.body.classList.remove("login-mode");
      who.hidden = false;
      const em = session.user.email || "";
      document.getElementById("who-email").textContent = em.endsWith("@phone.ypveterans.com")
        ? "+" + em.slice(0, 3) + " " + em.slice(3, 6) + "-" + em.slice(6, em.indexOf("@")) : em;

      const { data: me } = await db.from("organisers").select("email");
      if (!me || !me.length) {
        app.innerHTML = `<div class="card notice"><h2>No access</h2>
          <p>${esc(session.user.email)} isn't on the organiser list. Add it to the <code>organisers</code> table in Supabase.</p></div>`;
        return;
      }
      signedIn = true;
      document.body.classList.add("app-mode");
      route();
    }

    // ---------- Pages ----------
    // The menu links set #registrations, #fixtures … in the address; each opens its page
    const PAGES = { registrations: () => load(), fixtures: () => loadFixtures() };
    let page = "registrations";
    function route() {
      const want = location.hash.slice(1);
      page = PAGES[want] ? want : "registrations";
      document.querySelectorAll(".nav-item[data-page]").forEach(a => a.classList.toggle("active", a.dataset.page === page));
      lastSignature = "";
      PAGES[page]();
      scrollTo(0, 0);
    }
    addEventListener("hashchange", () => { if (signedIn) route(); });

    // silent = background check: only redraw when something changed, and never while typing
    async function load(silent = false) {
      if (silent) {
        const el = document.activeElement;
        if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
      } else {
        app.innerHTML = `<div class="ph"><div><h1>Team Registrations</h1></div></div><p class="notice">Loading registrations…</p>`;
      }
      const { data, error } = await db
        .from("teams")
        .select("*, players(id, position, name, age, jersey_number, id_photo_path, passport_photo_path), officials(role, name, phone, passport_photo_path, id_photo_path)")
        .order("created_at", { ascending: false });
      if (error) {
        if (!silent) app.innerHTML = `<div class="card notice"><h2>Couldn't load</h2><p>${esc(error.message)}</p></div>`;
        return;
      }
      const s = await db.from("settings").select("registration_open, closed_message, closes_at, instructions").eq("id", 1).single();
      lastLoaded = new Date();
      updateClock();

      const signature = JSON.stringify([data.map(t => [t.id, t.status, (t.players || []).length, (t.officials || []).length]), s.data]);
      if (silent && signature === lastSignature) return;
      const knownIds = new Set(teams.map(t => t.id));
      const newTeams = silent ? data.filter(t => !knownIds.has(t.id)) : [];
      lastSignature = signature;

      const roleOrder = ["manager", "coach", "official", "assistant", "medic"];
      teams = data.map(t => ({
        ...t,
        players: (t.players || []).sort((a, b) => a.position - b.position),
        officials: (t.officials || []).sort((a, b) => roleOrder.indexOf(a.role) - roleOrder.indexOf(b.role))
      }));
      teams.forEach(t => t.checks = teamChecks(t));
      if (s.data) settings = s.data;
      render();
      if (newTeams.length) toast(newTeams.length === 1
        ? "🔔 New registration: " + newTeams[0].team_name
        : "🔔 " + newTeams.length + " new registrations");
    }

    function updateClock() {
      if (lastLoaded) document.getElementById("updated").textContent = "Live · updated " + lastLoaded.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    // Check for new registrations every 30 seconds, and when coming back to this tab
    setInterval(() => { if (signedIn && page === "registrations" && !document.hidden) load(true); }, 30000);
    document.addEventListener("visibilitychange", () => { if (signedIn && page === "registrations" && !document.hidden) load(true); });

    function toast(text) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.classList.add("show"), 10);
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 5000);
    }

    // ---------- Render ----------
    function render() {
      if (!dl) dlFromSettings();
      const counts = {
        all: teams.length,
        pending: teams.filter(t => t.status === "pending").length,
        confirmed: teams.filter(t => t.status === "confirmed").length,
        rejected: teams.filter(t => t.status === "rejected").length,
        issues: teams.filter(t => t.checks.issues && t.status !== "rejected").length
      };
      const confirmedPlayers = teams.filter(t => t.status === "confirmed").reduce((n, t) => n + t.players.length, 0);
      const playerTotal = teams.reduce((n, t) => n + t.players.length, 0);
      const q = query.toLowerCase();
      const sorters = {
        newest: (a, b) => new Date(b.created_at) - new Date(a.created_at),
        oldest: (a, b) => new Date(a.created_at) - new Date(b.created_at),
        name: (a, b) => a.team_name.localeCompare(b.team_name),
        issues: (a, b) => b.checks.issues - a.checks.issues || new Date(b.created_at) - new Date(a.created_at)
      };
      const shown = teams.filter(t =>
        (filter === "all" || (filter === "issues" ? t.checks.issues && t.status !== "rejected" : t.status === filter)) &&
        (!q || [t.team_name, t.manager, t.island, t.phone, ...t.players.map(p => p.name), ...t.officials.map(o => o.name)].some(v => (v || "").toLowerCase().includes(q))))
        .sort(sorters[sortBy]);

      const deadlinePassed = settings.closes_at && Date.now() >= new Date(settings.closes_at);
      const open = settings.registration_open && !deadlinePassed;
      const pct = n => counts.all ? (n / counts.all * 100) + "%" : "0";
      const tabNames = { all: "All teams", pending: "Waiting", confirmed: "Confirmed", rejected: "Rejected", issues: "Need attention" };

      app.innerHTML = `
        <div class="ph"><div><h1>Team Registrations</h1><p>Teams that registered on the website. Open or close registration and check every squad.</p></div></div>
        <div class="card reg-control ${open ? "" : "closed"}">
          <div class="rc-top">
            <span class="rc-icon">${icon(open ? "unlock" : "lock")}</span>
            <div class="rc-text">
              <h2>Team registration <span class="rc-state">${open ? "OPEN" : "CLOSED"}</span></h2>
              <p>${open
                ? (settings.closes_at
                  ? `<span class="countdown">${icon("clock")} Closes in ${timeLeft(settings.closes_at)}</span> · ${fmtMv(settings.closes_at)}`
                  : "Teams can register on the website. No closing date set.")
                : deadlinePassed && settings.registration_open
                  ? `The closing date (${fmtMv(settings.closes_at)}) has passed. Clear or change it below to reopen.`
                  : "The website shows a “Registration is closed” message instead of the form."}</p>
            </div>
            <label class="switch-wrap">${settings.registration_open ? "On" : "Off"}
              <button class="switch" id="reg-switch" role="switch" aria-checked="${settings.registration_open}" aria-label="Registration open"></button>
            </label>
          </div>
          <div class="rc-body">
            <div class="rc-msg rc-actions">
              <label style="flex:1">Message shown to teams while closed
                <textarea id="closed-msg" rows="2" maxlength="500" placeholder="Optional, e.g. “Registration opens on 1 December”">${esc(settings.closed_message || "")}</textarea>
              </label>
              <button class="tool-btn" id="save-msg">Save message</button>
              <span class="rc-saved" id="msg-saved" hidden>✓ Saved</span>
            </div>
            <div class="rc-row">
              <div class="dl-box">
                <span class="lbl dl-title">${icon("calendar")} Closing date &amp; time <small>Maldives time</small></span>
                <div class="dl-step">Quick pick</div>
                <div class="chips">
                  ${[[3, "3 days"], [7, "1 week"], [14, "2 weeks"], [30, "1 month"]].map(([d, l]) => `<button type="button" class="chip" data-days="${d}">+ ${l}</button>`).join("")}
                </div>
                <div class="dl-step">Or choose a day</div>
                <div class="dl-inputs">
                  <input type="date" id="dl-date" value="${dl.date}" min="${mvToday()}" aria-label="Closing day">
                  <input type="time" id="dl-time" value="${dl.time}" aria-label="Closing time">
                </div>
                <div class="chips">
                  ${[["12:00", "12 noon"], ["18:00", "6 PM"], ["23:59", "11:59 PM"]].map(([v, l]) => `<button type="button" class="chip ${dl.time === v ? "on" : ""}" data-time="${v}">${l}</button>`).join("")}
                </div>
                <div class="dl-preview ${dlState().cls}" id="dl-preview">${dlState().html}</div>
                <div class="rc-actions">
                  <button class="save-btn" id="save-deadline" ${dlState().canSave ? "" : "disabled"}>${icon("check")} Save closing date</button>
                  ${settings.closes_at ? `<button class="tool-btn" id="clear-deadline">${icon("x")} Remove deadline</button>` : ""}
                </div>
              </div>
              <div class="dl-box">
                <label><span class="lbl dl-title">${icon("clipboard")} Checklist for teams</span><small>One item per line · leave empty for the standard list</small>
                  <textarea id="instructions" rows="7" maxlength="1000" placeholder="10 to 12 players, all aged 35 or older&#10;4 officials: manager, coach, official and medic&#10;A passport-size photo and an ID card photo for everyone&#10;The manager's phone number (on WhatsApp)">${esc(settings.instructions || "")}</textarea>
                </label>
                <div class="rc-actions">
                  <button class="tool-btn" id="save-extra">Save checklist</button>
                  <span class="rc-saved" id="extra-saved" hidden>✓ Saved</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="card stat"><span class="stat-ic">${icon("team")}</span><div><b>${counts.all}</b><span>Teams registered</span></div></div>
          <div class="card stat pending"><span class="stat-ic">${icon("clock")}</span><div><b>${counts.pending}</b><span>Waiting for review</span></div></div>
          <div class="card stat confirmed"><span class="stat-ic">${icon("check-circle")}</span><div><b>${counts.confirmed}</b><span>Confirmed teams</span></div></div>
          <div class="card stat"><span class="stat-ic">${icon("users")}</span><div><b>${playerTotal}</b><span>Players · ${confirmedPlayers} confirmed</span></div></div>
          <div class="card stat issues ${counts.issues ? "" : "none"}"><span class="stat-ic">${icon(counts.issues ? "alert" : "check")}</span><div><b>${counts.issues}</b><span>${counts.issues ? "Teams need attention" : "No problems found"}</span></div></div>
          ${counts.all ? `
          <div class="card stat-bar">
            <div class="bar">
              <i class="b-confirmed" style="width:${pct(counts.confirmed)}"></i><i class="b-pending" style="width:${pct(counts.pending)}"></i><i class="b-rejected" style="width:${pct(counts.rejected)}"></i>
            </div>
            <div class="legend">
              <span style="--c:var(--green)">Confirmed ${counts.confirmed}</span>
              <span style="--c:var(--gold)">Waiting ${counts.pending}</span>
              <span style="--c:var(--brand)">Rejected ${counts.rejected}</span>
            </div>
          </div>` : ""}
        </div>

        <div class="section-h"><h2>Teams</h2><span>Showing ${shown.length} of ${counts.all}</span></div>
        <div class="toolbar">
          <div class="tb-row">
            <div class="tabs">
              ${["all", "pending", "confirmed", "rejected", "issues"].map(f =>
                `<button class="tab ${filter === f ? "active" : ""}" data-filter="${f}">${tabNames[f]} <em>${counts[f]}</em></button>`).join("")}
            </div>
            <div class="tb-actions">
              <button class="tool-btn" id="refresh" title="Check for new registrations">${icon("refresh")} Refresh</button>
              <button class="tool-btn" id="export" ${counts.all ? "" : "disabled"}>${icon("download")} Export CSV</button>
            </div>
          </div>
          <div class="tb-row">
            <div class="search-box">${icon("search")}<input class="search" id="search" type="search" placeholder="Search team, player, manager, island or phone" value="${esc(query)}"></div>
            <select class="sort" id="sort" aria-label="Sort teams">
              ${[["newest", "Newest first"], ["oldest", "Oldest first"], ["name", "Team name A–Z"], ["issues", "Problems first"]].map(([v, l]) =>
                `<option value="${v}" ${sortBy === v ? "selected" : ""}>${l}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="teams">
          ${shown.length ? shown.map(teamCard).join("") : emptyState(counts.all, open)}
        </div>`;

      app.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
      const search = document.getElementById("search");
      search.oninput = () => { query = search.value; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
      document.getElementById("sort").onchange = e => { sortBy = e.target.value; render(); };
      document.getElementById("refresh").onclick = () => load();
      const clearBtn = document.getElementById("clear-filters");
      if (clearBtn) clearBtn.onclick = () => { filter = "all"; query = ""; render(); };
      const copyBtn = document.getElementById("copy-link");
      if (copyBtn) copyBtn.onclick = async () => {
        try { await navigator.clipboard.writeText(REG_LINK); toast("✓ Link copied: " + REG_LINK); }
        catch (e) { prompt("Copy this link:", REG_LINK); }
      };
      document.getElementById("reg-switch").onclick = e => { e.preventDefault(); toggleRegistration(); };
      document.getElementById("save-msg").onclick = saveClosedMessage;
      document.getElementById("save-extra").onclick = saveChecklist;
      wireDeadline();
      document.getElementById("export").onclick = exportCsv;

      app.querySelectorAll(".team").forEach(card => {
        const team = teams.find(t => t.id === card.dataset.id);
        card.querySelector(".team-head").onclick = () => toggle(card, team);
        card.querySelector(".more-btn").onclick = () => toggle(card, team);
        if (openIds.has(team.id)) { card.classList.add("open"); card.querySelector(".team-head").setAttribute("aria-expanded", "true"); card.querySelector(".more-btn").firstChild.textContent = "Close "; loadPhotos(card); }
        card.querySelectorAll("[data-status]").forEach(b => b.onclick = () => setStatus(team, b.dataset.status));
        card.querySelector(".delete").onclick = () => removeTeam(team);
      });
    }

    const initials = name => name.trim().split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
    const hue = name => [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    // Shown when there are no teams (or none match the search / tab)
    const REG_LINK = "https://ypveterans.com/#register";
    function emptyState(total, regOpen) {
      if (total) return `
        <div class="card empty">
          <span class="empty-ic">${icon("search")}</span>
          <h3>No teams match</h3>
          <p>Nothing in <b>${esc({ all: "All teams", pending: "Waiting", confirmed: "Confirmed", rejected: "Rejected", issues: "Need attention" }[filter])}</b>${query ? ` for “${esc(query)}”` : ""}.</p>
          <div class="empty-btns"><button class="tool-btn" id="clear-filters">${icon("x")} Clear search &amp; filters</button></div>
        </div>`;
      const share = "https://wa.me/?text=" + encodeURIComponent("Register your team for the YP Veterans Futsal Tournament: " + REG_LINK);
      return `
        <div class="card empty">
          <span class="empty-ic">${icon("team")}</span>
          <h3>No teams yet</h3>
          <p>When a team registers on the website it will appear here on its own. This page checks for new teams every 30 seconds.</p>
          ${regOpen ? "" : `<p class="empty-warn">${icon("lock")} Registration is closed. Turn it on at the top so teams can register.</p>`}
          <div class="empty-btns">
            <a class="tool-btn" href="./#register" target="_blank" rel="noopener">${icon("team")} Open registration form</a>
            <button class="tool-btn" id="copy-link">${icon("clipboard")} Copy link</button>
            <a class="tool-btn wa-btn" href="${share}" target="_blank" rel="noopener">${icon("chat")} Share on WhatsApp</a>
          </div>
          <div class="ghosts" aria-hidden="true">${"<i><b></b><s></s><s></s><u></u></i>".repeat(3)}</div>
        </div>`;
    }

    function teamCard(t) {
      const wa = "https://wa.me/" + (t.phone || "").replace(/[^\d]/g, "").replace(/^(?!960)(\d{7})$/, "960$1");
      const c = t.checks;
      const ages = t.players.map(p => p.age);
      const avgAge = ages.length ? Math.round(ages.reduce((a, b) => a + b, 0) / ages.length) : "—";
      const photo = (path, cls, alt, label) => path
        ? `<img class="thumb ${cls}" data-path="${esc(path)}" data-label="${esc(label)}" alt="${esc(alt)}">`
        : `<span class="thumb ${cls}" title="Missing"></span>`;
      const statusLabel = { pending: "Waiting", confirmed: "Confirmed", rejected: "Rejected" }[t.status] || t.status;
      return `
        <div class="card team s-${t.status}" data-id="${t.id}">
          <button class="team-head" aria-expanded="false">
            <span class="th-band">
              <span class="avatar" style="--h:${hue(t.team_name)}">${esc(initials(t.team_name))}</span>
              <span class="team-main">
                <span class="team-name">${esc(t.team_name)}</span>
                <span class="team-meta">
                  <span>${icon("pin")} ${esc(t.island)}</span>
                  <span title="${esc(fmtDate(t.created_at))}">${icon("clock")} ${ago(t.created_at)}</span>
                </span>
              </span>
              <span class="pill">${statusLabel}</span>
            </span>
            <span class="th-stats">
              <span class="th-stat ${c.list[0].ok ? "" : "bad"}"><b>${t.players.length}<small> / ${MAX_PLAYERS}</small></b><span>Players</span><span class="meter"><i style="width:${Math.min(100, t.players.length / MAX_PLAYERS * 100)}%"></i></span></span>
              <span class="th-stat ${c.list[2].ok ? "" : "bad"}"><b>${t.officials.length}<small> / ${ROLES.length}</small></b><span>Officials</span><span class="meter"><i style="width:${Math.min(100, t.officials.length / ROLES.length * 100)}%"></i></span></span>
              <span class="th-stat ${c.list[1].ok ? "" : "bad"}"><b>${avgAge}</b><span>Avg age</span><span class="meter"><i style="width:${c.list[1].ok ? 100 : 50}%"></i></span></span>
            </span>
            <span class="th-checks">
              ${c.list.map(k => `<span class="dot ${k.ok ? "" : "bad"}" title="${esc(k.short + ": " + k.title)}">${icon(k.icon)}</span>`).join("")}
              <span class="th-verdict ${c.issues ? "bad" : ""}">${c.issues ? `${c.issues} ${c.issues === 1 ? "problem" : "problems"}` : "All checks passed"}</span>
            </span>

                  </div>

    // Every stored photo of a team (passport and ID, officials and players)
    const teamPaths = t => [...t.officials, ...t.players].flatMap(p => [p.passport_photo_path, p.id_photo_path]).filter(Boolean);

    // Open a team and load its photos (private links that expire after an hour)
    function toggle(card, team) {
      const isOpen = card.classList.toggle("open");
      card.querySelector(".team-head").setAttribute("aria-expanded", isOpen);
      card.querySelector(".more-btn").firstChild.textContent = isOpen ? "Close " : "Details ";
      if (isOpen) { openIds.add(team.id); loadPhotos(card); card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      else openIds.delete(team.id);
    }

    function showPhoto(url, label) {
      photoDlg.querySelector("img").src = url;
      photoDlg.querySelector("p").textContent = label || "";
      photoDlg.showModal();
    }

    async function loadPhotos(card) {
      if (card.dataset.loaded) return;
      card.dataset.loaded = "1";
      const els = [...card.querySelectorAll("[data-path]")].filter(el => el.dataset.path);
      if (!els.length) return;
      const { data } = await db.storage.from("id-cards").createSignedUrls(els.map(el => el.dataset.path), 3600);
      (data || []).forEach((d, i) => {
        if (!d.signedUrl) return;
        const el = els[i];
        if (el.tagName === "IMG") el.src = d.signedUrl;
        el.onclick = e => { e.stopPropagation(); showPhoto(d.signedUrl, el.dataset.label); };
      });
    }

    async function toggleRegistration() {
      const next = !settings.registration_open;
      if (!next && !confirm("Close registration? Teams won't be able to register until you open it again.")) return;
      const sw = document.getElementById("reg-switch");
      sw.disabled = true;
      const { error } = await db.from("settings").update({ registration_open: next, updated_at: new Date().toISOString() }).eq("id", 1);
      sw.disabled = false;
      if (error) return alert("Couldn't change registration: " + error.message);
      settings.registration_open = next;
      render();
    }

    // Closing date picker: quick picks, day + time, live preview
    function wireDeadline() {
      const dateIn = document.getElementById("dl-date"), timeIn = document.getElementById("dl-time");
      const refresh = () => {
        dateIn.value = dl.date; timeIn.value = dl.time;
        app.querySelectorAll(".chip[data-time]").forEach(c => c.classList.toggle("on", c.dataset.time === dl.time));
        const st = dlState(), pv = document.getElementById("dl-preview");
        pv.className = "dl-preview " + st.cls;
        pv.innerHTML = st.html;
        document.getElementById("save-deadline").disabled = !st.canSave;
      };
      app.querySelectorAll(".chip[data-days]").forEach(c => c.onclick = () => {
        const d = new Date(mvToday() + "T00:00:00Z");
        d.setUTCDate(d.getUTCDate() + Number(c.dataset.days));
        dl.date = d.toISOString().slice(0, 10);
        dl.time = "23:59";   // end of that day
        refresh();
      });
      app.querySelectorAll(".chip[data-time]").forEach(c => c.onclick = () => { dl.time = c.dataset.time; refresh(); });
      dateIn.oninput = () => { dl.date = dateIn.value; refresh(); };
      timeIn.oninput = () => { dl.time = timeIn.value; refresh(); };
      document.getElementById("save-deadline").onclick = () => saveDeadline(dlIso());
      const clear = document.getElementById("clear-deadline");
      if (clear) clear.onclick = () => { if (confirm("Remove the closing date? Registration will stay open until you turn it off.")) saveDeadline(null); };
    }

    async function saveDeadline(closes_at) {
      const { error } = await db.from("settings").update({ closes_at, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closes_at = closes_at;
      dlFromSettings();
      render();
      toast(closes_at ? "✓ Closing date saved" : "Closing date removed");
    }

    async function saveChecklist() {
      const instructions = document.getElementById("instructions").value.trim() || null;
      const { error } = await db.from("settings").update({ instructions, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.instructions = instructions;
      render();
      const saved = document.getElementById("extra-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function saveClosedMessage() {
      const text = document.getElementById("closed-msg").value.trim();
      const { error } = await db.from("settings").update({ closed_message: text || null, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closed_message = text;
      const saved = document.getElementById("msg-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function setStatus(team, status) {
      const { error } = await db.from("teams").update({ status }).eq("id", team.id);
      if (error) return alert("Couldn't update: " + error.message);
      team.status = status;
      render();
      toast({ confirmed: "✓ " + team.team_name + " confirmed", rejected: team.team_name + " rejected", pending: team.team_name + " moved back to waiting" }[status]);
    }

    async function removeTeam(team) {
      if (!confirm(`Delete "${team.team_name}" with its officials, players and photos? This can't be undone.`)) return;
      const paths = teamPaths(team);
      if (paths.length) await db.storage.from("id-cards").remove(paths);
      const { error } = await db.from("teams").delete().eq("id", team.id);
      if (error) return alert("Couldn't delete: " + error.message);
      teams = teams.filter(t => t.id !== team.id);
      openIds.delete(team.id);
      render();
    }

    function exportCsv() {
      const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["Team", "Status", "Problems", "Manager", "Phone", "Coach", "Official", "Medic", "Island", "Registered", "Player #", "Jersey", "Player", "Age", "Notes"]];
      teams.forEach(t => {
        const off = role => t.officials.find(o => o.role === role) || {};
        const problems = t.checks.list.filter(k => !k.ok).map(k => k.title).join("; ");
        t.players.forEach(p => rows.push([
          t.team_name, t.status, problems, t.manager, t.phone, off("coach").name, off("official").name || off("assistant").name, off("medic").name,
          t.island, fmtDate(t.created_at), p.position, p.jersey_number, p.name, p.age, t.notes
        ]));
      });
      const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "yp-veterans-registrations.csv";
      a.click();
    }

    // ---------- Fixtures & Results ----------
    // Seasons (one per year) and their matches. The website's Match Results read these same tables.
    const TEAMS = window.YP_TEAMS || {};
    const fx = { seasons: [], matches: [], year: null, tab: "all", error: null };
    const STAGES = [["", "League"], ["semi", "Semi-final"], ["playoff", "Playoff"], ["final", "Final"]];
    const isPlayed = m => m.home_score !== null && m.away_score !== null;
    const teamLogo = name => {
      const t = TEAMS[name];
      return t ? `<img class="tl${t.fit ? " fit" : ""}" src="${esc(t.logo)}" alt="">` : `<span class="tl tl-i">${esc(initials(name))}</span>`;
    };
    const teamNames = () => [...new Set([...Object.keys(TEAMS), ...fx.matches.flatMap(m => [m.home, m.away])])].sort((a, b) => a.localeCompare(b));
    // Video time written as 1:02:03, 34:05 or plain seconds
    const toClock = sec => {
      if (sec === null || sec === undefined || sec === "") return "";
      const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = String(sec % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
    };
    const fromClock = v => {
      const parts = String(v).trim().split(":");
      if (!parts[0] || parts.length > 3 || parts.some(x => !/^\d+$/.test(x))) return null;
      return parts.reduce((t, x) => t * 60 + Number(x), 0);
    };
    const youtubeId = v => {
      const s = String(v || "").trim();
      const m = s.match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/);
      return m ? m[1] : null;
    };
    const fmtKick = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", weekday: "short", day: "numeric", month: "short" }).format(new Date(iso));
    const fmtKickTime = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));

    const fixturesHead = `<div class="ph"><div><h1>Fixtures &amp; Results</h1><p>Add matches, enter scores, goals and match videos. The website updates as soon as you save.</p></div>
      <div class="ph-act"><a class="btn" href="./#results" target="_blank" rel="noopener">${icon("external")} View on website</a>
      <button class="btn primary" id="fx-add">${icon("plus")} Add match</button></div></div>`;

    async function loadFixtures() {
      app.innerHTML = fixturesHead + `<p class="notice">Loading matches…</p>`;
      const [s, m] = await Promise.all([
        db.from("seasons").select("*").order("year", { ascending: false }),
        db.from("matches").select("*").order("day").order("no", { nullsFirst: false }).order("kickoff", { nullsFirst: false })
      ]);
      fx.error = s.error || m.error || null;
      if (!fx.error) {
        fx.seasons = s.data;
        fx.matches = m.data;
        if (!fx.seasons.some(x => x.year === fx.year)) fx.year = fx.seasons.length ? fx.seasons[0].year : null;
      }
      if (page === "fixtures") renderFixtures();
    }

    function renderFixtures() {
      if (fx.error) {
        const missing = /does not exist|schema cache|42P01/i.test(fx.error.message + " " + fx.error.code);
        app.innerHTML = fixturesHead + `<div class="card notice">
          <div class="big-ic">${icon("alert")}</div>
          <h2>${missing ? "One-time setup needed" : "Couldn't load matches"}</h2>
          <p>${missing ? "Open Supabase → SQL Editor and run <code>supabase/setup.sql</code>, then <code>supabase/seed-results.sql</code>. Then reload this page."
                        : esc(fx.error.message)}</p></div>`;
        return;
      }
      const season = fx.seasons.find(x => x.year === fx.year);
      const all = fx.matches.filter(m => m.year === fx.year);
      const counts = { all: all.length, fixtures: all.filter(m => !isPlayed(m)).length, results: all.filter(isPlayed).length };
      const list = all.filter(m => fx.tab === "all" || (fx.tab === "results" ? isPlayed(m) : !isPlayed(m)));
      const goals = all.filter(isPlayed).reduce((n, m) => n + m.home_score + m.away_score, 0);
      const tabs = [["fixtures", "Fixtures"], ["results", "Results"], ["all", "All matches"]];

      app.innerHTML = fixturesHead + `
        <div class="fx-bar">
          <label class="fx-season"><span>Season</span>
            <select id="fx-year">${fx.seasons.map(x => `<option value="${x.year}" ${x.year === fx.year ? "selected" : ""}>${x.year}</option>`).join("")}</select>
          </label>
          <button class="btn" id="fx-new-season">${icon("plus")} New season</button>
          ${season ? `<div class="seg" role="tablist">${tabs.map(([k, l]) => `<button class="seg-b ${fx.tab === k ? "on" : ""}" data-tab="${k}" role="tab" aria-selected="${fx.tab === k}">${l} <em>${counts[k]}</em></button>`).join("")}</div>` : ""}
        </div>
        ${season ? `
        <div class="card fx-season-card">
          <div class="fx-sum">
            <div><b>${counts.results}</b><span>Played</span></div>
            <div><b>${counts.fixtures}</b><span>Coming up</span></div>
            <div><b>${goals}</b><span>Goals</span></div>
          </div>
          <form class="fx-champ" id="fx-champ">
            <label><span class="lbl">${icon("trophy")} Champion</span><input name="champion" maxlength="100" value="${esc(season.champion || "")}" placeholder="Leave empty until the final"></label>
            <label>In Dhivehi <input name="champion_dv" maxlength="100" dir="rtl" value="${esc(season.champion_dv || "")}" placeholder="Optional"></label>
            <label class="fx-check" title="Hides the match and goal totals on the website"><input type="checkbox" name="partial" ${season.partial ? "checked" : ""}> Some results of this year are missing</label>
            <button class="btn" type="submit">${icon("check")} Save season</button>
          </form>
        </div>
        <div class="card fx-table">
          <div class="fx-row fx-hd"><span>Date</span><span>Match</span><span>Stage</span><span>Status</span><span></span></div>
          ${list.length ? list.map(fixtureRow).join("") : `<div class="fx-empty">${icon("ball")}<b>${all.length ? "Nothing here" : "No matches yet"}</b><span>${all.length ? "Try another tab." : "Add the first match of " + fx.year + "."}</span></div>`}
        </div>` : `
        <div class="card fx-empty big">${icon("calendar")}<b>No seasons yet</b><span>Start with “New season”, then add its matches.</span></div>`}`;

      document.getElementById("fx-add").disabled = !season;
      document.getElementById("fx-add").onclick = () => editMatch(null);
      document.getElementById("fx-new-season").onclick = newSeason;
      const yearSel = document.getElementById("fx-year");
      if (yearSel) yearSel.onchange = () => { fx.year = Number(yearSel.value); renderFixtures(); };
      app.querySelectorAll(".seg-b").forEach(b => b.onclick = () => { fx.tab = b.dataset.tab; renderFixtures(); });
      app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editMatch(fx.matches.find(m => m.id === b.dataset.edit)));
      const champ = document.getElementById("fx-champ");
      if (champ) champ.onsubmit = e => { e.preventDefault(); saveSeason(season, champ); };
    }

    function fixtureRow(m) {
      const played = isPlayed(m);
      const win = played ? (m.home_score > m.away_score ? "h" : m.home_score < m.away_score ? "a"
        : m.pen_home !== null && m.pen_away !== null ? (m.pen_home > m.pen_away ? "h" : "a") : "") : "";
      const stage = (STAGES.find(([k]) => k === (m.stage || "")) || STAGES[0])[1];
      return `
        <div class="fx-row">
          <span class="fx-date">${m.kickoff ? `<b>${fmtKick(m.kickoff)}</b>${fmtKickTime(m.kickoff)}` : `<b>Match day ${m.day}</b>`}${m.no ? `<small>Match ${m.no}</small>` : ""}</span>
          <span class="fx-match">
            <span class="fx-team ${win === "h" ? "win" : ""}">${teamLogo(m.home)}<span>${esc(m.home)}</span></span>
            <span class="fx-score ${played ? "" : "vs"}">${played ? `${m.home_score} – ${m.away_score}` : "v"}</span>
            <span class="fx-team away ${win === "a" ? "win" : ""}"><span>${esc(m.away)}</span>${teamLogo(m.away)}</span>
          </span>
          <span class="fx-stage">${stage}${m.pen_home !== null && m.pen_away !== null ? `<small>${m.pen_home}–${m.pen_away} pens</small>` : ""}</span>
          <span class="fx-status"><span class="pill ${played ? "confirmed" : "pending"}">${played ? "Played" : "Upcoming"}</span>
            ${m.video ? `<span class="fx-vid" title="Has a match video${m.goals && m.goals.length ? " and " + m.goals.length + " highlight clips" : ""}">${icon("play")}${m.goals && m.goals.length ? m.goals.length : ""}</span>` : ""}</span>
          <span class="fx-act"><button class="btn" data-edit="${m.id}">${icon("edit")} Edit</button></span>
        </div>`;
    }

    async function newSeason() {
      const next = fx.seasons.length ? Math.max(...fx.seasons.map(x => x.year)) + 1 : new Date().getFullYear();
      const v = prompt("Which year is the new season?", next);
      if (v === null) return;
      const year = Number(v);
      if (!Number.isInteger(year) || year < 2000 || year > 2100) return alert("Please enter a year, like " + next);
      if (fx.seasons.some(x => x.year === year)) { fx.year = year; return renderFixtures(); }
      const { error } = await db.from("seasons").insert({ year });
      if (error) return alert("Couldn't add the season: " + error.message);
      fx.year = year;
      fx.tab = "all";
      toast("✓ Season " + year + " added");
      loadFixtures();
    }

    async function saveSeason(season, form) {
      const row = { champion: form.champion.value.trim() || null, champion_dv: form.champion_dv.value.trim() || null, partial: form.partial.checked };
      const { error } = await db.from("seasons").update(row).eq("year", season.year);
      if (error) return alert("Couldn't save: " + error.message);
      Object.assign(season, row);
      toast("✓ Season " + season.year + " saved");
    }

    // ---------- Match editor ----------
    const fxDlg = document.createElement("dialog");
    fxDlg.className = "sheet";
    document.body.appendChild(fxDlg);
    fxDlg.addEventListener("click", e => { if (e.target === fxDlg) fxDlg.close(); });

    function editMatch(m) {
      const isNew = !m;
      const all = fx.matches.filter(x => x.year === fx.year);
      m = m || { day: all.length ? Math.max(...all.map(x => x.day)) : 1, no: all.length ? Math.max(0, ...all.map(x => x.no || 0)) + 1 : 1,
                 home: "", away: "", home_score: null, away_score: null, pen_home: null, pen_away: null, stage: null, video: null, goals: [], kickoff: null };
      const kick = toMvInput(m.kickoff);
      // Goals to edit: when the goal happens in the video. Older clips (found automatically) only have the clip end.
      const goals = (m.goals || []).map((g, i) => ({ i, team: g.team, at: g.at ?? Math.max(0, (g.t ?? 0) - 10) }));
      const num = v => v === null || v === undefined ? "" : v;

      fxDlg.innerHTML = `
        <form class="sheet-in" id="fx-form" novalidate>
          <div class="sheet-h">
            <div><h2>${isNew ? "Add match" : "Edit match"}</h2><p>Season ${fx.year}</p></div>
            <button type="button" class="icon-btn" id="fx-close" aria-label="Close">${icon("x")}</button>
          </div>
          <div class="sheet-b">
            <fieldset class="fs">
              <legend>Teams</legend>
              <div class="g2">
                <label>Home team<input name="home" list="fx-teams" required maxlength="60" value="${esc(m.home)}" autocomplete="off"></label>
                <label>Away team<input name="away" list="fx-teams" required maxlength="60" value="${esc(m.away)}" autocomplete="off"></label>
              </div>
              <datalist id="fx-teams">${teamNames().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
              <small class="hint">Pick a name from the list so the club logo shows. New names work too.</small>
            </fieldset>
            <fieldset class="fs">
              <legend>When</legend>
              <div class="g4">
                <label>Match day<input name="day" type="number" min="1" max="60" required value="${num(m.day)}"></label>
                <label>Match no.<input name="no" type="number" min="1" max="200" value="${num(m.no)}"></label>
                <label>Date<input name="date" type="date" value="${kick.slice(0, 10)}"></label>
                <label>Kick-off (MV)<input name="time" type="time" value="${kick.slice(11, 16)}"></label>
              </div>
              <label>Stage<select name="stage">${STAGES.map(([k, l]) => `<option value="${k}" ${(m.stage || "") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            </fieldset>
            <fieldset class="fs">
              <legend>Score <small>leave empty until the match is played</small></legend>
              <div class="score-in">
                <label><span id="lbl-home">${esc(m.home || "Home")}</span><input name="home_score" type="number" min="0" max="99" inputmode="numeric" value="${num(m.home_score)}"></label>
                <span class="dash">–</span>
                <label><span id="lbl-away">${esc(m.away || "Away")}</span><input name="away_score" type="number" min="0" max="99" inputmode="numeric" value="${num(m.away_score)}"></label>
              </div>
              <details class="pens" ${m.pen_home !== null ? "open" : ""}><summary>Penalty shootout</summary>
                <div class="score-in"><label>Home<input name="pen_home" type="number" min="0" max="99" value="${num(m.pen_home)}"></label><span class="dash">–</span><label>Away<input name="pen_away" type="number" min="0" max="99" value="${num(m.pen_away)}"></label></div>
              </details>
            </fieldset>
            <fieldset class="fs">
              <legend>Video &amp; highlights</legend>
              <label>YouTube link of the match<input name="video" placeholder="https://youtube.com/watch?v=…" value="${m.video ? "https://youtu.be/" + esc(m.video) : ""}" autocomplete="off"></label>
              <small class="hint" id="vid-state"></small>
              <div class="goals-ed" id="goals-ed">
                <div class="ge-h"><b>Goals</b><span>Time in the video when the goal is scored. Each becomes a highlight clip.</span></div>
                <div id="ge-rows"></div>
                <button type="button" class="btn" id="ge-add">${icon("plus")} Add goal</button>
                <small class="hint" id="ge-check"></small>
              </div>
            </fieldset>
            <p class="form-error" id="fx-err" role="alert"></p>
          </div>
          <div class="sheet-f">
            ${isNew ? "" : `<button type="button" class="btn danger" id="fx-del">${icon("trash")} Delete</button>`}
            <span class="sp"></span>
            <button type="button" class="btn" id="fx-cancel">Cancel</button>
            <button type="submit" class="btn primary">${icon("check")} ${isNew ? "Add match" : "Save"}</button>
          </div>
        </form>`;

      const f = document.getElementById("fx-form");
      const rows = document.getElementById("ge-rows");
      const sides = () => [f.home.value.trim() || "Home", f.away.value.trim() || "Away"];
      const goalRow = g => {
        const [h, a] = sides();
        const el = document.createElement("div");
        el.className = "ge-row";
        if (g.i !== undefined) el.dataset.i = g.i;
        el.innerHTML = `<select aria-label="Team"><option value="h">${esc(h)}</option><option value="a">${esc(a)}</option></select>
          <input aria-label="Time in the video" placeholder="34:05" value="${esc(toClock(g.at))}" inputmode="numeric">
          <button type="button" class="icon-btn" aria-label="Remove goal">${icon("x")}</button>`;
        el.querySelector("select").value = g.team === a && g.team !== h ? "a" : "h";
        el.querySelector("button").onclick = () => { el.remove(); check(); };
        el.querySelectorAll("select, input").forEach(x => x.oninput = () => check());
        rows.appendChild(el);
      };
      goals.forEach(goalRow);

      // Keep the goal team names and score labels in step with what's typed
      const check = () => {
        const [h, a] = sides();
        document.getElementById("lbl-home").textContent = h;
        document.getElementById("lbl-away").textContent = a;
        rows.querySelectorAll("select").forEach(sel => { sel.options[0].text = h; sel.options[1].text = a; });
        const id = youtubeId(f.video.value);
        const vs = document.getElementById("vid-state");
        vs.textContent = !f.video.value.trim() ? "Optional. Add it to show “Full match” and highlights on the website." : id ? "✓ Video found" : "That doesn't look like a YouTube link.";
        vs.className = "hint" + (f.video.value.trim() && !id ? " bad" : id ? " ok" : "");
        document.getElementById("goals-ed").hidden = !id;
        const sel = [...rows.querySelectorAll(".ge-row")];
        const hg = sel.filter(r => r.querySelector("select").value === "h").length, ag = sel.length - hg;
        const hs = f.home_score.value, as = f.away_score.value;
        const ck = document.getElementById("ge-check");
        ck.textContent = !sel.length ? "" : hs !== "" && as !== "" && (hg !== +hs || ag !== +as)
          ? `Goals add up to ${hg}–${ag}, but the score is ${hs}–${as}.` : `${hg}–${ag} from the goals listed.`;
        ck.className = "hint" + (ck.textContent.startsWith("Goals add up") ? " bad" : "");
      };
      f.querySelectorAll("input, select").forEach(x => x.addEventListener("input", check));
      document.getElementById("ge-add").onclick = () => { goalRow({ team: null, at: null }); rows.lastElementChild.querySelector("input").focus(); check(); };
      check();

      document.getElementById("fx-close").onclick = document.getElementById("fx-cancel").onclick = () => fxDlg.close();
      const del = document.getElementById("fx-del");
      if (del) del.onclick = async () => {
        if (!confirm(`Delete ${m.home} v ${m.away}? This can't be undone.`)) return;
        const { error } = await db.from("matches").delete().eq("id", m.id);
        if (error) return alert("Couldn't delete: " + error.message);
        fxDlg.close();
        toast("Match deleted");
        loadFixtures();
      };

      f.onsubmit = async e => {
        e.preventDefault();
        const err = document.getElementById("fx-err");
        const n = v => v === "" ? null : Number(v);
        const home = f.home.value.trim(), away = f.away.value.trim();
        const row = {
          year: fx.year, day: n(f.day.value), no: n(f.no.value), home, away,
          kickoff: f.date.value ? fromMvInput(f.date.value + "T" + (f.time.value || "00:00")) : null,
          home_score: n(f.home_score.value), away_score: n(f.away_score.value),
          pen_home: n(f.pen_home.value), pen_away: n(f.pen_away.value),
          stage: f.stage.value || null, video: youtubeId(f.video.value), updated_at: new Date().toISOString()
        };
        const problem = !home || !away ? "Enter both teams."
          : home === away ? "A team can't play itself."
          : !row.day ? "Enter the match day."
          : (row.home_score === null) !== (row.away_score === null) ? "Enter both scores, or leave both empty."
          : (row.pen_home === null) !== (row.pen_away === null) ? "Enter both penalty scores, or leave both empty."
          : f.video.value.trim() && !row.video ? "The video link isn't a YouTube link." : "";
        // Goals in time order, each with the score after it (home–away)
        let gh = 0, ga = 0, badTime = false;
        const goalsOut = row.video ? [...rows.querySelectorAll(".ge-row")].map(el => {
          const at = fromClock(el.querySelector("input").value);
          if (at === null) badTime = true;
          return { el, at, side: el.querySelector("select").value };
        }).sort((x, y) => x.at - y.at).map(({ el, at, side }) => {
          side === "h" ? gh++ : ga++;
          const team = side === "h" ? home : away, score = `${gh}–${ga}`;
          const old = el.dataset.i !== undefined ? m.goals[+el.dataset.i] : null;
          // An untouched clip keeps its original start and end
          if (old && goals[+el.dataset.i].at === at) return { ...old, team, score };
          return { at, s: Math.max(0, at - 25), t: at + 5, team, score };
        }) : [];
        const msg = problem || (badTime ? "Write each goal's time like 34:05." : "");
        if (msg) { err.textContent = msg; return; }
        row.goals = goalsOut;
        const btn = f.querySelector("[type=submit]");
        btn.disabled = true;
        const { error } = isNew ? await db.from("matches").insert(row) : await db.from("matches").update(row).eq("id", m.id);
        btn.disabled = false;
        if (error) { err.textContent = "Couldn't save: " + error.message; return; }
        fxDlg.close();
        toast(isNew ? "✓ Match added" : "✓ Match saved");
        loadFixtures();
      };
      fxDlg.showModal();
    }

    // ---------- App (install on the home screen) ----------
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("admin-sw.js", { scope: "./admin.html" }).catch(() => {});
    const isApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let installPrompt = null;
    // Show the Install buttons when the browser can install, or on iPhone/iPad (Add to Home Screen)
    const showInstall = () => document.querySelectorAll("[data-install]").forEach(b => {
      b.hidden = isApp || !(installPrompt || isIOS);
      b.onclick = async () => {
        if (installPrompt) {
          installPrompt.prompt();
          const { outcome } = await installPrompt.userChoice;
          if (outcome === "accepted") { installPrompt = null; showInstall(); }
        } else {
          alert("To install the app on your iPhone or iPad:\n\n1. Tap the Share button (square with an arrow) in Safari\n2. Choose “Add to Home Screen”\n3. Tap “Add”\n\nThe YP Organiser icon will appear on your home screen.");
        }
      };
    });
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; showInstall(); });
    addEventListener("appinstalled", () => { installPrompt = null; showInstall(); toast("✓ YP Organiser app installed"); });
    new MutationObserver(showInstall).observe(app, { childList: true });
    showInstall();

    start();
  </script>
</body>
</html>
