<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Organiser Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #f8f5f5;
      --surface: #ffffff;
      --text: #221516;
      --muted: #6b5a5b;
      --brand: #c8102e;
      --brand-dark: #8a0b1f;
      --brand-text: #c8102e;
      --gold: #e3b23c;
      --border: #e8dcdd;
      --tint: #fbeef0;
      --green: #1f9d55;
      --amber: #b7791f;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #120a0b;
        --surface: #1e1214;
        --text: #f3e8e9;
        --muted: #b7a2a5;
        --border: #3a2629;
        --brand-text: #ff6b80;
        --tint: #3a1a20;
        --green: #3ecf7f;
        --amber: #f0b44c;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    h1, h2, h3 { font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; }
    button { font: inherit; cursor: pointer; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    header { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 42px; height: 42px; border-radius: 50%; background: #fff; padding: 3px; border: 2px solid var(--gold); }
    .brand h1 { font-size: 1.15rem; }
    .brand small { display: block; color: #f6d6db; font-family: "Inter", sans-serif; font-size: .75rem; text-transform: none; letter-spacing: 0; }
    .ghost-btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 8px 14px; font-size: .85rem; }
    .ghost-btn:hover { background: rgba(255,255,255,.2); }

    main { padding: 28px 0 60px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    .notice { padding: 28px; text-align: center; color: var(--muted); }
    .notice h2 { color: var(--text); margin-bottom: 8px; }
    .notice code { background: var(--tint); padding: 2px 6px; border-radius: 4px; }

    /* Login */
    .login { max-width: 380px; margin: 40px auto; padding: 32px 28px; }
    .login h2 { margin-bottom: 4px; }
    .login p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
    .login label { display: block; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
    .login input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; }
    .login input:focus { outline: none; border-color: var(--brand); }
    .primary-btn { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; }
    .primary-btn:hover { background: var(--brand-dark); }
    .primary-btn:disabled { opacity: .7; cursor: wait; }
    .form-error { margin-top: 12px; color: var(--brand-text); font-size: .88rem; }

    /* Registration open / closed control */
    .reg-control { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 18px 20px; margin-bottom: 16px; border-inline-start: 5px solid var(--green); }
    .reg-control.closed { border-inline-start-color: var(--brand); }
    .rc-text { flex: 1; min-width: 200px; }
    .rc-text h2 { font-size: 1.1rem; }
    .rc-text p { color: var(--muted); font-size: .88rem; }
    .rc-state { font-weight: 600; }
    .reg-control .rc-state { color: var(--green); }
    .reg-control.closed .rc-state { color: var(--brand-text); }
    .switch { position: relative; flex-shrink: 0; width: 64px; height: 34px; border: 0; padding: 0; border-radius: 99px; background: var(--border); transition: background .25s ease; }
    .switch[aria-checked="true"] { background: var(--green); }
    .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.4, 1.4, .6, 1); }
    .switch[aria-checked="true"]::after { transform: translateX(30px); }
    .switch:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    .switch:disabled { opacity: .6; cursor: wait; }
    .rc-msg { flex-basis: 100%; display: none; gap: 8px; align-items: flex-start; }
    .reg-control.closed .rc-msg { display: flex; }
    .rc-msg textarea { flex: 1; font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; resize: vertical; min-height: 44px; }
    .rc-msg textarea:focus { outline: none; border-color: var(--brand); }
    .rc-saved { color: var(--green); font-size: .85rem; align-self: center; }
    .rc-extra { flex-basis: 100%; display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .rc-extra label { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
    .rc-extra small { font-weight: 400; }
    .rc-extra input, .rc-extra textarea { font: inherit; font-size: .9rem; font-weight: 400; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; resize: vertical; }
    .rc-extra input:focus, .rc-extra textarea:focus { outline: none; border-color: var(--brand); }
    .rc-extra-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
    @media (max-width: 720px) { .rc-extra { grid-template-columns: 1fr; } }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat { padding: 16px 18px; }
    .stat b { display: block; font: 700 2rem "Oswald", sans-serif; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .82rem; }
    .stat.pending b { color: var(--amber); }
    .stat.confirmed b { color: var(--green); }

    /* Toolbar */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
    .tab { border: 0; background: none; color: var(--muted); padding: 7px 14px; border-radius: 99px; font-size: .85rem; font-weight: 600; }
    .tab.active { background: var(--brand); color: #fff; }
    .search { flex: 1; min-width: 180px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 9px 16px; }
    .search:focus { outline: none; border-color: var(--brand); }
    .tool-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 99px; padding: 8px 14px; font-size: .85rem; font-weight: 600; }
    .tool-btn:hover { border-color: var(--brand); color: var(--brand-text); }

    /* Team cards */
    .teams { display: grid; gap: 12px; }
    .team { overflow: hidden; }
    .team-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
    .team-head:hover { background: var(--tint); }
    .team-main { flex: 1; min-width: 0; }
    .team-main h3 { font-size: 1.15rem; }
    .team-meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
    .pill { flex-shrink: 0; padding: 4px 12px; border-radius: 99px; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .pill.pending { background: rgba(183, 121, 31, .15); color: var(--amber); }
    .pill.confirmed { background: rgba(31, 157, 85, .15); color: var(--green); }
    .pill.rejected { background: var(--tint); color: var(--brand-text); }
    .count { flex-shrink: 0; font: 700 1.1rem "Oswald", sans-serif; color: var(--muted); }
    .chev { flex-shrink: 0; color: var(--muted); transition: transform .2s ease; }
    .team.open .chev { transform: rotate(180deg); }

    .team-body { display: none; border-top: 1px solid var(--border); padding: 18px; }
    .team.open .team-body { display: block; }
    .contact { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .contact a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: .85rem; }
    .contact a.wa { background: #25d366; border-color: #25d366; color: #06371a; font-weight: 600; }
    .notes { background: var(--tint); border-radius: 10px; padding: 10px 14px; font-size: .9rem; margin-bottom: 14px; white-space: pre-wrap; }

    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    td.num { color: var(--muted); width: 36px; }
    .age-bad { color: var(--brand-text); font-weight: 600; }
    .thumb { width: 64px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--tint); border: 1px solid var(--border); cursor: zoom-in; display: block; }
    .thumb.portrait { width: 40px; height: 52px; }
    .no-photo { color: var(--muted); font-size: .8rem; }
    .sub-h { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 8px; }

    /* Officials: manager, coach, official, medic */
    .officials { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .official { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
    .official > div { flex: 1; min-width: 0; }
    .official small { display: block; color: var(--brand-text); font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
    .official b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .official a { color: var(--muted); font-size: .85rem; text-decoration: none; }
    .official .pics { display: flex; gap: 6px; flex-shrink: 0; }
    .official .thumb { width: 40px; height: 52px; }
    .official .thumb.wide { width: 60px; height: 52px; }
    @media (max-width: 720px) { .officials { grid-template-columns: 1fr; } }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .act { border: 1.5px solid var(--border); background: none; color: var(--text); padding: 8px 16px; border-radius: 10px; font-size: .88rem; font-weight: 600; }
    .act.confirm { border-color: var(--green); color: var(--green); }
    .act.confirm:hover { background: var(--green); color: #fff; }
    .act.reject { border-color: var(--amber); color: var(--amber); }
    .act.reject:hover { background: var(--amber); color: #fff; }
    .act.delete { margin-inline-start: auto; border-color: var(--brand); color: var(--brand-text); }
    .act.delete:hover { background: var(--brand); color: #fff; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translate(-50%, 20px); opacity: 0;
      background: var(--green); color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: transform .3s ease, opacity .3s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    dialog { border: 0; border-radius: 12px; padding: 0; max-width: min(900px, calc(100vw - 32px)); background: #111; }
    dialog::backdrop { background: rgba(0,0,0,.8); }
    dialog img { display: block; max-width: 100%; max-height: 85vh; }
    dialog button { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.4rem; }

    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .team-head { flex-wrap: wrap; }
      .count { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="images/yp-logo.jpg" alt="">
        <div><h1>Organiser Dashboard</h1><small>YP Veterans Futsal · Team registrations</small></div>
      </div>
      <button class="ghost-btn" id="logout" hidden>Log out</button>
    </div>
  </header>

  <main class="wrap" id="app">
    <p class="notice">Loading…</p>
  </main>

  <dialog id="photo"><img alt="Photo"><button aria-label="Close">&times;</button></dialog>

  <script type="module">
    const CONFIG = window.YP_CONFIG || {};
    const app = document.getElementById("app");
    const logoutBtn = document.getElementById("logout");
    const photoDlg = document.getElementById("photo");
    photoDlg.querySelector("button").onclick = () => photoDlg.close();
    photoDlg.onclick = e => { if (e.target === photoDlg) photoDlg.close(); };

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = d => new Date(d).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

    if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) {
      app.innerHTML = `<div class="card notice"><h2>Not connected yet</h2>
        <p>Add your Supabase URL and key to <code>config.js</code>, then reload this page.</p></div>`;
      throw new Error("Supabase not configured");
    }

    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
    const db = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

    let teams = [];
    let settings = { registration_open: true, closed_message: "", closes_at: null, instructions: "" };
    // <input type="datetime-local"> works in local time; the tournament runs on Maldives time (UTC+5)
    const toMvInput = iso => iso ? new Date(new Date(iso).getTime() + 5 * 3600000).toISOString().slice(0, 16) : "";
    const fromMvInput = v => v ? new Date(v + ":00+05:00").toISOString() : null;
    const fmtMv = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }).format(new Date(iso));
    let filter = "all";
    const openIds = new Set();   // teams the organiser has expanded; kept open across refreshes
    let lastSignature = "";
    let signedIn = false;
    let query = "";

    // ---------- Login ----------
    function showLogin(message = "") {
      logoutBtn.hidden = true;
      app.innerHTML = `
        <form class="card login" id="login">
          <h2>Organiser login</h2>
          <p>Only organisers can see registrations and ID card photos.</p>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button class="primary-btn" type="submit">Log in</button>
          <p class="form-error" id="login-error">${esc(message)}</p>
        </form>`;
      const form = document.getElementById("login");
      form.onsubmit = async e => {
        e.preventDefault();
        const btn = form.querySelector("button");
        btn.disabled = true;
        const { error } = await db.auth.signInWithPassword({
          email: form.email.value.trim(),
          password: form.password.value
        });
        btn.disabled = false;
        if (error) document.getElementById("login-error").textContent = "Wrong email or password.";
        else start();
      };
    }

    logoutBtn.onclick = async () => { signedIn = false; await db.auth.signOut(); showLogin(); };

    // ---------- Load data ----------
    async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return showLogin();
      logoutBtn.hidden = false;

      const { data: me } = await db.from("organisers").select("email");
      if (!me || !me.length) {
        app.innerHTML = `<div class="card notice"><h2>No access</h2>
          <p>${esc(session.user.email)} isn't on the organiser list. Add it to the <code>organisers</code> table in Supabase.</p></div>`;
        return;
      }
      signedIn = true;
      await load();
    }

    // silent = background check: only redraw when something changed, and never while typing
    async function load(silent = false) {
      if (silent) {
        const el = document.activeElement;
        if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
      } else {
        app.innerHTML = `<p class="notice">Loading registrations…</p>`;
      }
      const { data, error } = await db
        .from("teams")
        .select("*, players(id, position, name, age, jersey_number, id_photo_path, passport_photo_path), officials(role, name, phone, passport_photo_path, id_photo_path)")
        .order("created_at", { ascending: false });
      if (error) {
        if (!silent) app.innerHTML = `<div class="card notice"><h2>Couldn't load</h2><p>${esc(error.message)}</p></div>`;
        return;
      }
      const s = await db.from("settings").select("registration_open, closed_message, closes_at, instructions").eq("id", 1).single();

      const signature = JSON.stringify([data.map(t => [t.id, t.status, (t.players || []).length, (t.officials || []).length]), s.data]);
      if (silent && signature === lastSignature) return;
      const knownIds = new Set(teams.map(t => t.id));
      const newTeams = silent ? data.filter(t => !knownIds.has(t.id)) : [];
      lastSignature = signature;

      const roleOrder = ["manager", "coach", "official", "medic"];
      teams = data.map(t => ({
        ...t,
        players: (t.players || []).sort((a, b) => a.position - b.position),
        officials: (t.officials || []).sort((a, b) => roleOrder.indexOf(a.role) - roleOrder.indexOf(b.role))
      }));
      if (s.data) settings = s.data;
      render();
      if (newTeams.length) toast(newTeams.length === 1
        ? "🔔 New registration: " + newTeams[0].team_name
        : "🔔 " + newTeams.length + " new registrations");
    }

    // Check for new registrations every 30 seconds, and when coming back to this tab
    setInterval(() => { if (signedIn && !document.hidden) load(true); }, 30000);
    document.addEventListener("visibilitychange", () => { if (signedIn && !document.hidden) load(true); });

    function toast(text) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.classList.add("show"), 10);
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 5000);
    }

    // ---------- Render ----------
    function render() {
      const counts = {
        all: teams.length,
        pending: teams.filter(t => t.status === "pending").length,
        confirmed: teams.filter(t => t.status === "confirmed").length,
        rejected: teams.filter(t => t.status === "rejected").length
      };
      const playerTotal = teams.reduce((n, t) => n + t.players.length, 0);
      const q = query.toLowerCase();
      const shown = teams.filter(t =>
        (filter === "all" || t.status === filter) &&
        (!q || [t.team_name, t.manager, t.island, t.phone].some(v => (v || "").toLowerCase().includes(q))));

      const deadlinePassed = settings.closes_at && Date.now() >= new Date(settings.closes_at);
      const open = settings.registration_open && !deadlinePassed;
      app.innerHTML = `
        <div class="card reg-control ${open ? "" : "closed"}">
          <div class="rc-text">
            <h2>Team registration</h2>
            <p>Registration is <span class="rc-state">${open ? "OPEN" : "CLOSED"}</span>. ${open
              ? "Teams can register on the website." + (settings.closes_at ? ` Closes automatically on <b>${fmtMv(settings.closes_at)}</b>.` : "")
              : deadlinePassed && settings.registration_open
                ? `The closing date (${fmtMv(settings.closes_at)}) has passed. Clear or change it below to reopen.`
                : "The website shows a “Registration is closed” message instead of the form."}</p>
          </div>
          <button class="switch" id="reg-switch" role="switch" aria-checked="${settings.registration_open}" aria-label="Registration open"></button>
          <div class="rc-msg">
            <textarea id="closed-msg" maxlength="500" placeholder="Optional message for teams, e.g. “Registration opens on 1 December”">${esc(settings.closed_message || "")}</textarea>
            <button class="tool-btn" id="save-msg">Save message</button>
            <span class="rc-saved" id="msg-saved" hidden>✓ Saved</span>
          </div>
          <div class="rc-extra">
            <label>Closing date &amp; time <small>(Maldives time · leave empty for no deadline)</small>
              <input type="datetime-local" id="closes-at" value="${toMvInput(settings.closes_at)}">
            </label>
            <label>Checklist for teams <small>(one item per line · leave empty for the standard list)</small>
              <textarea id="instructions" rows="4" maxlength="1000" placeholder="10 to 12 players, all aged 35 or older&#10;4 officials: manager, coach, official and medic&#10;A passport-size photo and an ID card photo for everyone&#10;The manager's phone number (on WhatsApp)">${esc(settings.instructions || "")}</textarea>
            </label>
            <div class="rc-extra-actions">
              <button class="tool-btn" id="save-extra">Save date &amp; checklist</button>
              <span class="rc-saved" id="extra-saved" hidden>✓ Saved</span>
            </div>
          </div>
        </div>
        <div class="stats">
          <div class="card stat"><b>${counts.all}</b><span>Teams registered</span></div>
          <div class="card stat pending"><b>${counts.pending}</b><span>Waiting for review</span></div>
          <div class="card stat confirmed"><b>${counts.confirmed}</b><span>Confirmed</span></div>
          <div class="card stat"><b>${playerTotal}</b><span>Players</span></div>
        </div>
        <div class="toolbar">
          <div class="tabs">
            ${["all", "pending", "confirmed", "rejected"].map(f =>
              `<button class="tab ${filter === f ? "active" : ""}" data-filter="${f}">${f[0].toUpperCase() + f.slice(1)} (${counts[f]})</button>`).join("")}
          </div>
          <input class="search" id="search" type="search" placeholder="Search team, manager, island or phone" value="${esc(query)}">
          <button class="tool-btn" id="refresh">↻ Refresh</button>
          <button class="tool-btn" id="export">⬇ Export CSV</button>
        </div>
        <div class="teams">
          ${shown.length ? shown.map(teamCard).join("") : `<div class="card notice">No teams here yet.</div>`}
        </div>`;

      app.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
      const search = document.getElementById("search");
      search.oninput = () => { query = search.value; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
      document.getElementById("refresh").onclick = () => load();
      document.getElementById("reg-switch").onclick = toggleRegistration;
      document.getElementById("save-msg").onclick = saveClosedMessage;
      document.getElementById("save-extra").onclick = saveDeadlineAndChecklist;
      document.getElementById("export").onclick = exportCsv;

      app.querySelectorAll(".team").forEach(card => {
        const team = teams.find(t => t.id === card.dataset.id);
        card.querySelector(".team-head").onclick = () => toggle(card, team);
        if (openIds.has(team.id)) { card.classList.add("open"); loadPhotos(card); }
        card.querySelector(".confirm").onclick = () => setStatus(team, "confirmed");
        card.querySelector(".reject").onclick = () => setStatus(team, "rejected");
        card.querySelector(".delete").onclick = () => removeTeam(team);
      });
    }

    function teamCard(t) {
      const wa = "https://wa.me/" + (t.phone || "").replace(/[^\d]/g, "").replace(/^(?!960)(\d{7})$/, "960$1");
      return `
        <div class="card team" data-id="${t.id}">
          <div class="team-head">
            <div class="team-main">
              <h3>${esc(t.team_name)}</h3>
              <div class="team-meta">
                <span>👤 ${esc(t.manager)}</span>
                <span>📍 ${esc(t.island)}</span>
                <span>🕒 ${fmtDate(t.created_at)}</span>
              </div>
            </div>
            <span class="count">${t.players.length} players</span>
            <span class="pill ${t.status}">${t.status}</span>
            <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="team-body">
            <div class="contact">
              <a href="tel:${esc(t.phone)}">📞 ${esc(t.phone)}</a>
              <a class="wa" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>
            </div>
            ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ""}
            ${t.officials.length ? `
              <h4 class="sub-h">Officials</h4>
              <div class="officials">
                ${t.officials.map(o => `
                  <div class="official">
                    <div>
                      <small>${esc(o.role)}</small>
                      <b>${esc(o.name)}</b>
                      <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>
                    </div>
                    <span class="pics">
                      <img class="thumb" data-path="${esc(o.passport_photo_path)}" alt="Passport photo of ${esc(o.name)}">
                      <img class="thumb wide" data-path="${esc(o.id_photo_path)}" alt="ID card of ${esc(o.name)}">
                    </span>
                  </div>`).join("")}
              </div>` : ""}
            <h4 class="sub-h">Players</h4>
            <table>
              <thead><tr><th>#</th><th>Jersey</th><th>Player</th><th>Age</th><th>Photo</th><th>ID card</th></tr></thead>
              <tbody>
                ${t.players.map(p => `
                  <tr>
                    <td class="num">${p.position}</td>
                    <td><b>${p.jersey_number ?? "—"}</b></td>
                    <td>${esc(p.name)}</td>
                    <td class="${p.age < 35 ? "age-bad" : ""}">${p.age}</td>
                    <td>${p.passport_photo_path ? `<img class="thumb portrait" data-path="${esc(p.passport_photo_path)}" alt="Passport photo of ${esc(p.name)}">` : `<span class="no-photo">—</span>`}</td>
                    <td><img class="thumb" data-path="${esc(p.id_photo_path)}" alt="ID card of ${esc(p.name)}"></td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <div class="actions">
              <button class="act confirm">✓ Confirm team</button>
              <button class="act reject">✕ Reject</button>
              <button class="act delete">🗑 Delete</button>
            </div>
          </div>
        </div>`;
    }

    // Every stored photo of a team (passport and ID, officials and players)
    const teamPaths = t => [...t.officials, ...t.players].flatMap(p => [p.passport_photo_path, p.id_photo_path]).filter(Boolean);

    // Open a team and load its photos (private links that expire after an hour)
    function toggle(card, team) {
      card.classList.toggle("open");
      if (card.classList.contains("open")) { openIds.add(team.id); loadPhotos(card); }
      else openIds.delete(team.id);
    }

    async function loadPhotos(card) {
      if (card.dataset.loaded) return;
      card.dataset.loaded = "1";
      const imgs = [...card.querySelectorAll(".thumb")];
      const { data } = await db.storage.from("id-cards").createSignedUrls(imgs.map(i => i.dataset.path), 3600);
      (data || []).forEach((d, i) => {
        if (!d.signedUrl) return;
        imgs[i].src = d.signedUrl;
        imgs[i].onclick = () => { photoDlg.querySelector("img").src = d.signedUrl; photoDlg.showModal(); };
      });
    }

    async function toggleRegistration() {
      const next = !settings.registration_open;
      if (!next && !confirm("Close registration? Teams won't be able to register until you open it again.")) return;
      const sw = document.getElementById("reg-switch");
      sw.disabled = true;
      const { error } = await db.from("settings").update({ registration_open: next, updated_at: new Date().toISOString() }).eq("id", 1);
      sw.disabled = false;
      if (error) return alert("Couldn't change registration: " + error.message);
      settings.registration_open = next;
      render();
    }

    async function saveDeadlineAndChecklist() {
      const closes_at = fromMvInput(document.getElementById("closes-at").value);
      const instructions = document.getElementById("instructions").value.trim() || null;
      const { error } = await db.from("settings").update({ closes_at, instructions, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closes_at = closes_at;
      settings.instructions = instructions;
      render();
      const saved = document.getElementById("extra-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function saveClosedMessage() {
      const text = document.getElementById("closed-msg").value.trim();
      const { error } = await db.from("settings").update({ closed_message: text || null, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closed_message = text;
      const saved = document.getElementById("msg-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function setStatus(team, status) {
      const { error } = await db.from("teams").update({ status }).eq("id", team.id);
      if (error) return alert("Couldn't update: " + error.message);
      team.status = status;
      render();
    }

    async function removeTeam(team) {
      if (!confirm(`Delete "${team.team_name}" with its officials, players and photos? This can't be undone.`)) return;
      const paths = teamPaths(team);
      if (paths.length) await db.storage.from("id-cards").remove(paths);
      const { error } = await db.from("teams").delete().eq("id", team.id);
      if (error) return alert("Couldn't delete: " + error.message);
      teams = teams.filter(t => t.id !== team.id);
      render();
    }

    function exportCsv() {
      const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["Team", "Status", "Manager", "Phone", "Coach", "Coach phone", "Official", "Official phone", "Medic", "Medic phone", "Island", "Registered", "Player #", "Jersey", "Player", "Age", "Notes"]];
      teams.forEach(t => {
        const off = role => t.officials.find(o => o.role === role) || {};
        t.players.forEach(p => rows.push([
          t.team_name, t.status, t.manager, t.phone, off("coach").name, off("coach").phone, off("official").name, off("official").phone, off("medic").name, off("medic").phone,
          t.island, fmtDate(t.created_at), p.position, p.jersey_number, p.name, p.age, t.notes
        ]));
      });
      const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "yp-veterans-registrations.csv";
      a.click();
    }

    start();
  </script>
</body>
</html>
