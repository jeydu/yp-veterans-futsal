    // Every stored photo of a team (passport and ID, officials and players)
    const teamPaths = t => [...t.officials, ...t.players].flatMap(p => [p.passport_photo_path, p.id_photo_path]).filter(Boolean);

    function showPhoto(url, label) {
      photoDlg.querySelector("img").src = url;
      photoDlg.querySelector("p").textContent = label || "";
      photoDlg.showModal();
    }

    async function loadPhotos(card) {
      if (card.dataset.loaded) return;
      card.dataset.loaded = "1";
      const els = [...card.querySelectorAll("[data-path]")].filter(el => el.dataset.path);
      if (!els.length) return;
      const { data } = await db.storage.from("id-cards").createSignedUrls(els.map(el => el.dataset.path), 3600);
      (data || []).forEach((d, i) => {
        if (!d.signedUrl) return;
        const el = els[i];
        if (el.tagName === "IMG") el.src = d.signedUrl;
        el.onclick = e => { e.stopPropagation(); showPhoto(d.signedUrl, el.dataset.label); };
      });
    }

    async function toggleRegistration() {
      const next = !settings.registration_open;
      if (!next && !confirm("Close registration? Teams won't be able to register until you open it again.")) return;
      const sw = document.getElementById("reg-switch");
      sw.disabled = true;
      const { error } = await db.from("settings").update({ registration_open: next, updated_at: new Date().toISOString() }).eq("id", 1);
      sw.disabled = false;
      if (error) return alert("Couldn't change registration: " + error.message);
      settings.registration_open = next;
      render();
    }

    // Closing date picker: quick picks, day + time, live preview
    function wireDeadline() {
      const dateIn = document.getElementById("dl-date"), timeIn = document.getElementById("dl-time");
      const refresh = () => {
        dateIn.value = dl.date; timeIn.value = dl.time;
        document.querySelectorAll(".chip[data-time]").forEach(c => c.classList.toggle("on", c.dataset.time === dl.time));
        const st = dlState(), pv = document.getElementById("dl-preview");
        pv.className = "dl-preview " + st.cls;
        pv.innerHTML = st.html;
        document.getElementById("save-deadline").disabled = !st.canSave;
      };
      document.querySelectorAll(".chip[data-days]").forEach(c => c.onclick = () => {
        const d = new Date(mvToday() + "T00:00:00Z");
        d.setUTCDate(d.getUTCDate() + Number(c.dataset.days));
        dl.date = d.toISOString().slice(0, 10);
        dl.time = "23:59";   // end of that day
        refresh();
      });
      document.querySelectorAll(".chip[data-time]").forEach(c => c.onclick = () => { dl.time = c.dataset.time; refresh(); });
      dateIn.oninput = () => { dl.date = dateIn.value; refresh(); };
      timeIn.oninput = () => { dl.time = timeIn.value; refresh(); };
      document.getElementById("save-deadline").onclick = () => saveDeadline(dlIso());
      const clear = document.getElementById("clear-deadline");
      if (clear) clear.onclick = () => { if (confirm("Remove the closing date? Registration will stay open until you turn it off.")) saveDeadline(null); };
    }

    async function saveDeadline(closes_at) {
      const { error } = await db.from("settings").update({ closes_at, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closes_at = closes_at;
      dlFromSettings();
      render();
      toast(closes_at ? "✓ Closing date saved" : "Closing date removed");
    }

    // The checklist as editable lines: type to change, ↑ to move up, ✕ to remove
    const STANDARD_CHECKLIST = ["10 to 12 players, all aged 35 or older", "4 officials: manager, coach, official and medic",
      "A passport-size photo and an ID card photo for everyone", "The manager's phone number (on WhatsApp)"];
    function wireChecklist() {
      const box = document.getElementById("ck-list");
      const items = (settings.instructions || "").split("\n").map(l => l.trim()).filter(Boolean);
      const add = text => {
        const row = document.createElement("div");
        row.className = "ck-row";
        row.innerHTML = `<span class="ck-tick">${icon("check")}</span><input maxlength="200" placeholder="New item" value="${esc(text)}" aria-label="Checklist item">
          <button type="button" class="icon-btn" data-ck="up" aria-label="Move up">${icon("chev")}</button>
          <button type="button" class="icon-btn" data-ck="rm" aria-label="Remove item">${icon("x")}</button>`;
        row.querySelector('[data-ck="up"]').onclick = () => { if (row.previousElementSibling) box.insertBefore(row, row.previousElementSibling); };
        row.querySelector('[data-ck="rm"]').onclick = () => row.remove();
        box.appendChild(row);
        return row;
      };
      (items.length ? items : STANDARD_CHECKLIST).forEach(add);
      document.getElementById("ck-add").onclick = () => add("").querySelector("input").focus();
      document.getElementById("ck-reset").onclick = () => { box.innerHTML = ""; STANDARD_CHECKLIST.forEach(add); };
    }

    async function saveChecklist() {
      const lines = [...document.querySelectorAll("#ck-list input")].map(i => i.value.trim()).filter(Boolean);
      // The standard list is stored as "nothing", so the website keeps its translated version
      const instructions = lines.length && lines.join("\n") !== STANDARD_CHECKLIST.join("\n") ? lines.join("\n") : null;
      const { error } = await db.from("settings").update({ instructions, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.instructions = instructions;
      render();
      const saved = document.getElementById("extra-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function saveClosedMessage() {
      const text = document.getElementById("closed-msg").value.trim();
      const { error } = await db.from("settings").update({ closed_message: text || null, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) return alert("Couldn't save: " + error.message);
      settings.closed_message = text;
      const saved = document.getElementById("msg-saved");
      saved.hidden = false;
      setTimeout(() => saved.hidden = true, 2000);
    }

    async function setStatus(team, status) {
      const { error } = await db.from("teams").update({ status }).eq("id", team.id);
      if (error) return alert("Couldn't update: " + error.message);
      team.status = status;
      render();
      toast({ confirmed: "✓ " + team.team_name + " confirmed", rejected: team.team_name + " rejected", pending: team.team_name + " moved back to waiting" }[status]);
    }

    async function removeTeam(team) {
      if (!confirm(`Delete "${team.team_name}" with its officials, players and photos? This can't be undone.`)) return false;
      const paths = teamPaths(team);
      if (paths.length) await db.storage.from("id-cards").remove(paths);
      const { error } = await db.from("teams").delete().eq("id", team.id);
      if (error) { alert("Couldn't delete: " + error.message); return false; }
      teams = teams.filter(t => t.id !== team.id);
      render();
      return true;
    }

    function exportCsv() {
      const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["Team", "Status", "Problems", "Manager", "Phone", "Coach", "Official", "Medic", "Island", "Registered", "Player #", "Jersey", "Player", "Age", "Notes"]];
      teams.forEach(t => {
        const off = role => t.officials.find(o => o.role === role) || {};
        const problems = t.checks.list.filter(k => !k.ok).map(k => k.title).join("; ");
        t.players.forEach(p => rows.push([
          t.team_name, t.status, problems, t.manager, t.phone, off("coach").name, off("official").name || off("assistant").name, off("medic").name,
          t.island, fmtDate(t.created_at), p.position, p.jersey_number, p.name, p.age, t.notes
        ]));
      });
      const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "yp-veterans-registrations.csv";
      a.click();
    }

    // ---------- Fixtures & Results ----------
    // Seasons (one per year) and their matches. The website's Match Results read these same tables.
    const TEAMS = window.YP_TEAMS || {};
    const fx = { seasons: [], matches: [], year: null, tab: "all", error: null };
    const STAGES = [["", "Group stage"], ["semi", "Semi-final"], ["playoff", "Playoff"], ["final", "Final"]];
    const isPlayed = m => m.home_score !== null && m.away_score !== null;
    const teamLogo = name => {
      const t = TEAMS[name];
      return t ? `<img class="tl${t.fit ? " fit" : ""}" src="${esc(t.logo)}" alt="">` : `<span class="tl tl-i">${esc(initials(name))}</span>`;
    };
    const teamNames = () => [...new Set([...Object.keys(TEAMS), ...clubs.map(c => c.name), ...fx.matches.flatMap(m => [m.home, m.away])])].sort((a, b) => a.localeCompare(b));
    // Video time written as 1:02:03, 34:05 or plain seconds
    const toClock = sec => {
      if (sec === null || sec === undefined || sec === "") return "";
      const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = String(sec % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
    };
    const fromClock = v => {
      const parts = String(v).trim().split(":");
      if (!parts[0] || parts.length > 3 || parts.some(x => !/^\d+$/.test(x))) return null;
      return parts.reduce((t, x) => t * 60 + Number(x), 0);
    };
    const youtubeId = v => {
      const s = String(v || "").trim();
      const m = s.match(/(?:v=|youtu\.be\/|embed\/|live\/|shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/);
      return m ? m[1] : null;
    };
    const fmtKick = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", weekday: "short", day: "numeric", month: "short" }).format(new Date(iso));
    const fmtKickTime = iso => new Intl.DateTimeFormat("en-GB", { timeZone: "Indian/Maldives", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));

    const fixturesHead = `<div class="ph"><div><h1>Fixtures &amp; Results</h1><p>Add matches, enter scores, goals and match videos. The website updates as soon as you save.</p></div>
      <div class="ph-act"><a class="btn" href="./#results" target="_blank" rel="noopener">${icon("external")} View on website</a>
      <button class="btn" id="fx-bulk">${icon("calendar")} Add many matches</button>
      <button class="btn primary" id="fx-add">${icon("plus")} Add match</button></div></div>`;

    async function loadFixtures() {
      app.innerHTML = fixturesHead + `<p class="notice">Loading matches…</p>`;
      const [s, , m] = await Promise.all([
        db.from("seasons").select("*").order("year", { ascending: false }),
        loadClubs(),
        db.from("matches").select("*").order("day").order("no", { nullsFirst: false }).order("kickoff", { nullsFirst: false })
      ]);
      fx.error = s.error || m.error || null;
      if (!fx.error) {
        fx.seasons = s.data;
        fx.matches = m.data;
        if (!fx.seasons.some(x => x.year === fx.year)) fx.year = fx.seasons.length ? fx.seasons[0].year : null;
      }
      if (page === "fixtures") renderFixtures();
    }

    function renderFixtures() {
      if (fx.error) {
        const missing = /does not exist|schema cache|42P01/i.test(fx.error.message + " " + fx.error.code);
        app.innerHTML = fixturesHead + `<div class="card notice">
          <div class="big-ic">${icon("alert")}</div>
          <h2>${missing ? "One-time setup needed" : "Couldn't load matches"}</h2>
          <p>${missing ? "Open Supabase → SQL Editor and run <code>supabase/setup.sql</code>, then <code>supabase/seed-results.sql</code>. Then reload this page."
                        : esc(fx.error.message)}</p></div>`;
        return;
      }
      const season = fx.seasons.find(x => x.year === fx.year);
      const all = fx.matches.filter(m => m.year === fx.year);
      const counts = { all: all.length, fixtures: all.filter(m => !isPlayed(m)).length, results: all.filter(isPlayed).length };
      const list = all.filter(m => fx.tab === "all" || (fx.tab === "results" ? isPlayed(m) : !isPlayed(m)));
      const goals = all.filter(isPlayed).reduce((n, m) => n + m.home_score + m.away_score, 0);
      const tabs = [["fixtures", "Fixtures"], ["results", "Results"], ["all", "All matches"]];

      app.innerHTML = fixturesHead + `
        <div class="fx-bar">
          <label class="fx-season"><span>Season</span>
            <select id="fx-year">${fx.seasons.map(x => `<option value="${x.year}" ${x.year === fx.year ? "selected" : ""}>${x.year}</option>`).join("")}</select>
          </label>
          <button class="btn" id="fx-new-season">${icon("plus")} New season</button>
          ${season ? `<div class="seg" role="tablist">${tabs.map(([k, l]) => `<button class="seg-b ${fx.tab === k ? "on" : ""}" data-tab="${k}" role="tab" aria-selected="${fx.tab === k}">${l} <em>${counts[k]}</em></button>`).join("")}</div>` : ""}
        </div>
        ${season ? `
        <div class="card fx-season-card">
          <div class="fx-sum">
            <div><b>${counts.results}</b><span>Played</span></div>
            <div><b>${counts.fixtures}</b><span>Coming up</span></div>
            <div><b>${goals}</b><span>Goals</span></div>
          </div>
          <form class="fx-champ" id="fx-champ">
            <label><span class="lbl">${icon("trophy")} Champion</span><input name="champion" maxlength="100" value="${esc(season.champion || "")}" placeholder="Leave empty until the final"></label>
            <label>In Dhivehi <input name="champion_dv" maxlength="100" dir="rtl" value="${esc(season.champion_dv || "")}" placeholder="Optional"></label>
            <label class="fx-check" title="Hides the match and goal totals on the website"><input type="checkbox" name="partial" ${season.partial ? "checked" : ""}> Some results of this year are missing</label>
            <button class="btn" type="submit">${icon("check")} Save season</button>
          </form>
        </div>
        <div class="card fx-table">
          <div class="fx-row fx-hd"><span>Date</span><span>Match</span><span>Stage</span><span>Status</span><span></span></div>
          ${list.length ? list.map(fixtureRow).join("") : `<div class="fx-empty">${icon("ball")}<b>${all.length ? "Nothing here" : "No matches yet"}</b><span>${all.length ? "Try another tab." : "Add the first match of " + fx.year + "."}</span></div>`}
        </div>` : `
        <div class="card fx-empty big">${icon("calendar")}<b>No seasons yet</b><span>Start with “New season”, then add its matches.</span></div>`}`;

      document.getElementById("fx-add").disabled = document.getElementById("fx-bulk").disabled = !season;
      document.getElementById("fx-add").onclick = () => editMatch(null);
      document.getElementById("fx-bulk").onclick = () => bulkFixtures();
      document.getElementById("fx-new-season").onclick = newSeason;
      const yearSel = document.getElementById("fx-year");
      if (yearSel) yearSel.onchange = () => { fx.year = Number(yearSel.value); renderFixtures(); };
      app.querySelectorAll(".seg-b").forEach(b => b.onclick = () => { fx.tab = b.dataset.tab; renderFixtures(); });
      app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editMatch(fx.matches.find(m => m.id === b.dataset.edit)));
      const champ = document.getElementById("fx-champ");
      if (champ) champ.onsubmit = e => { e.preventDefault(); saveSeason(season, champ); };
    }

    function fixtureRow(m) {
      const played = isPlayed(m);
      const win = played ? (m.home_score > m.away_score ? "h" : m.home_score < m.away_score ? "a"
        : m.pen_home !== null && m.pen_away !== null ? (m.pen_home > m.pen_away ? "h" : "a") : "") : "";
      const stage = (STAGES.find(([k]) => k === (m.stage || "")) || STAGES[0])[1];
      return `
        <div class="fx-row">
          <span class="fx-date">${m.kickoff ? `<b>${fmtKick(m.kickoff)}</b>${fmtKickTime(m.kickoff)}` : `<b>Match day ${m.day}</b>`}${m.no ? `<small>Match ${m.no}</small>` : ""}</span>
          <span class="fx-match">
            <span class="fx-team ${win === "h" ? "win" : ""}">${teamLogo(m.home)}<span>${esc(m.home)}</span></span>
            <span class="fx-score ${played ? "" : "vs"}">${played ? `${m.home_score} – ${m.away_score}` : "v"}</span>
            <span class="fx-team away ${win === "a" ? "win" : ""}"><span>${esc(m.away)}</span>${teamLogo(m.away)}</span>
          </span>
          <span class="fx-stage">${stage}${m.pen_home !== null && m.pen_away !== null ? `<small>${m.pen_home}–${m.pen_away} pens</small>` : ""}</span>
          <span class="fx-status"><span class="pill ${played ? "confirmed" : "pending"}">${played ? "Played" : "Upcoming"}</span>
            ${m.video ? `<span class="fx-vid" title="Has a match video${m.goals && m.goals.length ? " and " + m.goals.length + " highlight clips" : ""}">${icon("play")}${m.goals && m.goals.length ? m.goals.length : ""}</span>` : ""}</span>
          <span class="fx-act"><button class="btn" data-edit="${m.id}">${icon("edit")} Edit</button></span>
        </div>`;
    }

    async function newSeason() {
      const next = fx.seasons.length ? Math.max(...fx.seasons.map(x => x.year)) + 1 : new Date().getFullYear();
      const v = prompt("Which year is the new season?", next);
      if (v === null) return;
      const year = Number(v);
      if (!Number.isInteger(year) || year < 2000 || year > 2100) return alert("Please enter a year, like " + next);
      if (fx.seasons.some(x => x.year === year)) { fx.year = year; return renderFixtures(); }
      const { error } = await db.from("seasons").insert({ year });
      if (error) return alert("Couldn't add the season: " + error.message);
      fx.year = year;
      fx.tab = "all";
      toast("✓ Season " + year + " added");
      loadFixtures();
    }

    async function saveSeason(season, form) {
      const row = { champion: form.champion.value.trim() || null, champion_dv: form.champion_dv.value.trim() || null, partial: form.partial.checked };
      const { error } = await db.from("seasons").update(row).eq("year", season.year);
      if (error) return alert("Couldn't save: " + error.message);
      Object.assign(season, row);
      toast("✓ Season " + season.year + " saved");
    }


    // ---------- Add many matches at once ----------
    // Set the day once (date, first kick-off, gap, match day, stage), then tap two teams to make each match.
    // Kick-off times follow the order of the list. "Save & next day" carries on with the day after.
    function bulkFixtures(start) {
      const all = fx.matches.filter(x => x.year === fx.year);
      const st = start || {
        day: all.length ? Math.max(...all.map(x => x.day)) + 1 : 1,
        no: all.length ? Math.max(0, ...all.map(x => x.no || 0)) + 1 : 1,
        date: "", first: "20:45", gap: 60, stage: ""
      };
      const list = [];      // matches made so far: [home, away]
      let pick = null;      // the team tapped first (home)
      const teams = teamNames();

      fxDlg.innerHTML = `
        <form class="sheet-in" id="bk-form" novalidate>
          <div class="sheet-h"><div><h2>Add many matches</h2><p>Season ${fx.year}</p></div>
            <button type="button" class="icon-btn" id="bk-close" aria-label="Close">${icon("x")}</button></div>
          <div class="sheet-b">
            <div class="ez-step"><b>1</b> Set the day</div>
            <div class="ez-day">
              <label>Date<input name="date" type="date" value="${st.date}"></label>
              <label>First kick-off<input name="first" type="time" value="${st.first}"></label>
              <label>Minutes between<input name="gap" type="number" min="0" max="240" step="5" inputmode="numeric" value="${st.gap}"></label>
              <label>Match day<input name="day" type="number" min="1" max="60" inputmode="numeric" value="${st.day}"></label>
              <label>Stage<select name="stage">${STAGES.map(([k, l]) => `<option value="${k}" ${k === st.stage ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            </div>
            <div class="ez-step"><b>2</b> <span id="ez-say">Tap the home team</span></div>
            <div class="ez-teams" id="ez-teams">
              ${teams.map(n => `<button type="button" class="ez-team" data-team="${esc(n)}">${teamLogo(n)}<span>${esc(n)}</span></button>`).join("")}
              <button type="button" class="ez-team ez-other" id="ez-other">${icon("plus")}<span>Other team</span></button>
            </div>
            <div class="ez-step"><b>3</b> Check the matches</div>
            <div class="ez-list" id="ez-list"></div>
            <p class="form-error" id="bk-err" role="alert"></p>
          </div>
          <div class="sheet-f">
            <button type="button" class="btn ez-cancel" id="bk-cancel">Cancel</button><span class="sp"></span>
            <button type="button" class="btn" id="bk-next" disabled>Save &amp; next day</button>
            <button type="submit" class="btn primary" id="bk-save" disabled>${icon("check")} Save</button>
          </div>
        </form>`;
      const f = document.getElementById("bk-form");

      // Kick-off of the n-th match of the day, as "HH:MM"
      const timeOf = n => {
        const [h, m] = (f.first.value || "20:45").split(":").map(Number);
        const t = h * 60 + m + n * (Number(f.gap.value) || 0);
        return String(Math.floor(t / 60) % 24).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
      };
      const draw = () => {
        document.getElementById("ez-say").textContent = pick ? `Now tap the team playing ${pick}` : "Tap the home team";
        document.querySelectorAll(".ez-team[data-team]").forEach(b => {
          b.classList.toggle("on", b.dataset.team === pick);
          b.classList.toggle("used", list.some(([h, a]) => h === b.dataset.team || a === b.dataset.team));
        });
        document.getElementById("ez-list").innerHTML = list.length ? list.map(([h, a], i) => `
          <div class="ez-m">
            <span class="ez-time">${timeOf(i)}</span>
            <span class="ez-vs"><span>${teamLogo(h)}${esc(h)}</span><em>v</em><span>${teamLogo(a)}${esc(a)}</span></span>
            <span class="ez-tools">
              ${i ? `<button type="button" class="icon-btn" data-up="${i}" aria-label="Move earlier">${icon("chev")}</button>` : ""}
              <button type="button" class="icon-btn" data-swap="${i}" aria-label="Swap home and away">⇄</button>
              <button type="button" class="icon-btn" data-del="${i}" aria-label="Remove match">${icon("x")}</button>
            </span>
          </div>`).join("") : `<p class="hint ez-none">No matches yet. Tap two teams above.</p>`;
        document.getElementById("bk-save").disabled = document.getElementById("bk-next").disabled = !list.length;
        document.getElementById("bk-save").innerHTML = `${icon("check")} Save ${list.length || ""} match${list.length === 1 ? "" : "es"}`;
      };
      const choose = name => {
        if (!pick) { pick = name; }
        else if (pick === name) { pick = null; }
        else { list.push([pick, name]); pick = null; }
        draw();
      };
      document.getElementById("ez-teams").onclick = e => {
        const b = e.target.closest(".ez-team[data-team]");
        if (b) choose(b.dataset.team);
      };
      document.getElementById("ez-other").onclick = () => {
        const name = (prompt("Team name") || "").trim().slice(0, 60);
        if (name) choose(name);
      };
      document.getElementById("ez-list").onclick = e => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.del) list.splice(+b.dataset.del, 1);
        if (b.dataset.swap) list[+b.dataset.swap].reverse();
        if (b.dataset.up) { const i = +b.dataset.up; [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
        draw();
      };
      ["first", "gap"].forEach(k => f[k].addEventListener("input", draw));
      document.getElementById("bk-close").onclick = document.getElementById("bk-cancel").onclick = () => fxDlg.close();

      const save = async next => {
        const err = document.getElementById("bk-err");
        const day = Number(f.day.value);
        if (!day) { err.textContent = "Enter the match day."; return; }
        if (!f.date.value && !confirm("No date set. Save these matches without a date and time?")) return;
        let no = st.no;
        const rows = list.map(([home, away], i) => ({
          year: fx.year, day, no: no++, home, away, stage: f.stage.value || null, goals: [],
          kickoff: f.date.value ? fromMvInput(f.date.value + "T" + timeOf(i)) : null
        }));
        document.querySelectorAll("#bk-next, #bk-save").forEach(b => b.disabled = true);
        const { error } = await db.from("matches").insert(rows);
        if (error) { err.textContent = "Couldn't save: " + error.message; draw(); return; }
        toast(`✓ ${rows.length} match${rows.length === 1 ? "" : "es"} added`);
        fx.tab = "fixtures";
        await loadFixtures();
        if (next) {
          // Same settings, the next date and match day
          let d = "";
          if (f.date.value) { const x = new Date(f.date.value + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + 1); d = x.toISOString().slice(0, 10); }
          bulkFixtures({ day: day + 1, no, date: d, first: f.first.value, gap: Number(f.gap.value) || 0, stage: f.stage.value });
        } else fxDlg.close();
      };
      f.onsubmit = e => { e.preventDefault(); save(false); };
      document.getElementById("bk-next").onclick = () => save(true);
      draw();
      if (!fxDlg.open) fxDlg.showModal();
    }

    // ---------- Match editor ----------
    const fxDlg = document.createElement("dialog");
    fxDlg.className = "sheet";
    document.body.appendChild(fxDlg);
    fxDlg.addEventListener("click", e => { if (e.target === fxDlg) fxDlg.close(); });

    function editMatch(m) {
      const isNew = !m;
      const all = fx.matches.filter(x => x.year === fx.year);
      m = m || { day: all.length ? Math.max(...all.map(x => x.day)) : 1, no: all.length ? Math.max(0, ...all.map(x => x.no || 0)) + 1 : 1,
                 home: "", away: "", home_score: null, away_score: null, pen_home: null, pen_away: null, stage: null, video: null, goals: [], kickoff: null };
      const kick = toMvInput(m.kickoff);
      // Goals to edit: when the goal happens in the video. Older clips (found automatically) only have the clip end.
      const goals = (m.goals || []).map((g, i) => ({ i, team: g.team, at: g.at ?? Math.max(0, (g.t ?? 0) - 10) }));
      const num = v => v === null || v === undefined ? "" : v;

      fxDlg.innerHTML = `
        <form class="sheet-in" id="fx-form" novalidate>
          <div class="sheet-h">
            <div><h2>${isNew ? "Add match" : "Edit match"}</h2><p>Season ${fx.year}</p></div>
            <button type="button" class="icon-btn" id="fx-close" aria-label="Close">${icon("x")}</button>
          </div>
          <div class="sheet-b">
            <fieldset class="fs">
              <legend>Teams</legend>
              <div class="g2">
                <label>Home team<input name="home" list="fx-teams" required maxlength="60" value="${esc(m.home)}" autocomplete="off"></label>
                <label>Away team<input name="away" list="fx-teams" required maxlength="60" value="${esc(m.away)}" autocomplete="off"></label>
              </div>
              <datalist id="fx-teams">${teamNames().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
              <small class="hint">Pick a name from the list so the club logo shows. New names work too.</small>
            </fieldset>
            <fieldset class="fs">
              <legend>When</legend>
              <div class="g4">
                <label>Match day<input name="day" type="number" min="1" max="60" required value="${num(m.day)}"></label>
                <label>Match no.<input name="no" type="number" min="1" max="200" value="${num(m.no)}"></label>
                <label>Date<input name="date" type="date" value="${kick.slice(0, 10)}"></label>
                <label>Kick-off (MV)<input name="time" type="time" value="${kick.slice(11, 16)}"></label>
              </div>
              <label>Stage<select name="stage">${STAGES.map(([k, l]) => `<option value="${k}" ${(m.stage || "") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            </fieldset>
            <fieldset class="fs">
              <legend>Score <small>leave empty until the match is played</small></legend>
              <div class="score-in">
                <label><span id="lbl-home">${esc(m.home || "Home")}</span><input name="home_score" type="number" min="0" max="99" inputmode="numeric" value="${num(m.home_score)}"></label>
                <span class="dash">–</span>
                <label><span id="lbl-away">${esc(m.away || "Away")}</span><input name="away_score" type="number" min="0" max="99" inputmode="numeric" value="${num(m.away_score)}"></label>
              </div>
              <details class="pens" ${m.pen_home !== null ? "open" : ""}><summary>Penalty shootout</summary>
                <div class="score-in"><label>Home<input name="pen_home" type="number" min="0" max="99" value="${num(m.pen_home)}"></label><span class="dash">–</span><label>Away<input name="pen_away" type="number" min="0" max="99" value="${num(m.pen_away)}"></label></div>
              </details>
            </fieldset>
            <fieldset class="fs">
              <legend>Video &amp; highlights</legend>
              <label>YouTube link of the match<input name="video" placeholder="https://youtube.com/watch?v=…" value="${m.video ? "https://youtu.be/" + esc(m.video) : ""}" autocomplete="off"></label>
              <small class="hint" id="vid-state"></small>
              <div class="goals-ed" id="goals-ed">
                <div class="ge-h"><b>Goals</b><span>Time in the video when the goal is scored. Each becomes a highlight clip.</span></div>
                <div id="ge-rows"></div>
                <button type="button" class="btn" id="ge-add">${icon("plus")} Add goal</button>
                <small class="hint" id="ge-check"></small>
              </div>
            </fieldset>
            <p class="form-error" id="fx-err" role="alert"></p>
          </div>
          <div class="sheet-f">
            ${isNew ? "" : `<button type="button" class="btn danger" id="fx-del">${icon("trash")} Delete</button>`}
            <span class="sp"></span>
            <button type="button" class="btn" id="fx-cancel">Cancel</button>
            <button type="submit" class="btn primary">${icon("check")} ${isNew ? "Add match" : "Save"}</button>
          </div>
        </form>`;

      const f = document.getElementById("fx-form");
      const rows = document.getElementById("ge-rows");
      const sides = () => [f.home.value.trim() || "Home", f.away.value.trim() || "Away"];
      const goalRow = g => {
        const [h, a] = sides();
        const el = document.createElement("div");
        el.className = "ge-row";
        if (g.i !== undefined) el.dataset.i = g.i;
        el.innerHTML = `<select aria-label="Team"><option value="h">${esc(h)}</option><option value="a">${esc(a)}</option></select>
          <input aria-label="Time in the video" placeholder="34:05" value="${esc(toClock(g.at))}" inputmode="numeric">
          <button type="button" class="icon-btn" aria-label="Remove goal">${icon("x")}</button>`;
        el.querySelector("select").value = g.team === a && g.team !== h ? "a" : "h";
        el.querySelector("button").onclick = () => { el.remove(); check(); };
        el.querySelectorAll("select, input").forEach(x => x.oninput = () => check());
        rows.appendChild(el);
      };
      goals.forEach(goalRow);

      // Keep the goal team names and score labels in step with what's typed
      const check = () => {
        const [h, a] = sides();
        document.getElementById("lbl-home").textContent = h;
        document.getElementById("lbl-away").textContent = a;
        rows.querySelectorAll("select").forEach(sel => { sel.options[0].text = h; sel.options[1].text = a; });
        const id = youtubeId(f.video.value);
        const vs = document.getElementById("vid-state");
        vs.textContent = !f.video.value.trim() ? "Optional. Add it to show “Full match” and highlights on the website." : id ? "✓ Video found" : "That doesn't look like a YouTube link.";
        vs.className = "hint" + (f.video.value.trim() && !id ? " bad" : id ? " ok" : "");
        document.getElementById("goals-ed").hidden = !id;
        const sel = [...rows.querySelectorAll(".ge-row")];
        const hg = sel.filter(r => r.querySelector("select").value === "h").length, ag = sel.length - hg;
        const hs = f.home_score.value, as = f.away_score.value;
        const ck = document.getElementById("ge-check");
        ck.textContent = !sel.length ? "" : hs !== "" && as !== "" && (hg !== +hs || ag !== +as)
          ? `Goals add up to ${hg}–${ag}, but the score is ${hs}–${as}.` : `${hg}–${ag} from the goals listed.`;
        ck.className = "hint" + (ck.textContent.startsWith("Goals add up") ? " bad" : "");
      };
      f.querySelectorAll("input, select").forEach(x => x.addEventListener("input", check));
      document.getElementById("ge-add").onclick = () => { goalRow({ team: null, at: null }); rows.lastElementChild.querySelector("input").focus(); check(); };
      check();

      document.getElementById("fx-close").onclick = document.getElementById("fx-cancel").onclick = () => fxDlg.close();
      const del = document.getElementById("fx-del");
      if (del) del.onclick = async () => {
        if (!confirm(`Delete ${m.home} v ${m.away}? This can't be undone.`)) return;
        const { error } = await db.from("matches").delete().eq("id", m.id);
        if (error) return alert("Couldn't delete: " + error.message);
        fxDlg.close();
        toast("Match deleted");
        loadFixtures();
      };

      f.onsubmit = async e => {
        e.preventDefault();
        const err = document.getElementById("fx-err");
        const n = v => v === "" ? null : Number(v);
        const home = f.home.value.trim(), away = f.away.value.trim();
        const row = {
          year: fx.year, day: n(f.day.value), no: n(f.no.value), home, away,
          kickoff: f.date.value ? fromMvInput(f.date.value + "T" + (f.time.value || "00:00")) : null,
          home_score: n(f.home_score.value), away_score: n(f.away_score.value),
          pen_home: n(f.pen_home.value), pen_away: n(f.pen_away.value),
          stage: f.stage.value || null, video: youtubeId(f.video.value), updated_at: new Date().toISOString()
        };
        const problem = !home || !away ? "Enter both teams."
          : home === away ? "A team can't play itself."
          : !row.day ? "Enter the match day."
          : (row.home_score === null) !== (row.away_score === null) ? "Enter both scores, or leave both empty."
          : (row.pen_home === null) !== (row.pen_away === null) ? "Enter both penalty scores, or leave both empty."
          : f.video.value.trim() && !row.video ? "The video link isn't a YouTube link." : "";
        // Goals in time order, each with the score after it (home–away)
        let gh = 0, ga = 0, badTime = false;
        const goalsOut = row.video ? [...rows.querySelectorAll(".ge-row")].map(el => {
          const at = fromClock(el.querySelector("input").value);
          if (at === null) badTime = true;
          return { el, at, side: el.querySelector("select").value };
        }).sort((x, y) => x.at - y.at).map(({ el, at, side }) => {
          side === "h" ? gh++ : ga++;
          const team = side === "h" ? home : away, score = `${gh}–${ga}`;
          const old = el.dataset.i !== undefined ? m.goals[+el.dataset.i] : null;
          // An untouched clip keeps its original start and end
          if (old && goals[+el.dataset.i].at === at) return { ...old, team, score };
          return { at, s: Math.max(0, at - 25), t: at + 5, team, score };
        }) : [];
        const msg = problem || (badTime ? "Write each goal's time like 34:05." : "");
        if (msg) { err.textContent = msg; return; }
        row.goals = goalsOut;
        const btn = f.querySelector("[type=submit]");
        btn.disabled = true;
        const { error } = isNew ? await db.from("matches").insert(row) : await db.from("matches").update(row).eq("id", m.id);
        btn.disabled = false;
        if (error) { err.textContent = "Couldn't save: " + error.message; return; }
        fxDlg.close();
        toast(isNew ? "✓ Match added" : "✓ Match saved");
        loadFixtures();
      };
      fxDlg.showModal();
    }

    // ---------- Teams & Players ----------
    // One row per club: logo, short name, manager and squad. Logos also show on the website's results and fixtures.
    let clubs = [];
    let clubsError = null;
    // Put saved clubs into the shared team list, so their logos show everywhere in the portal
    function mergeClubs() {
      clubs.forEach(c => { if (c.logo) TEAMS[c.name] = { logo: c.logo, fit: c.logo_fit }; });
    }
    async function loadClubs() {
      const { data, error } = await db.from("clubs").select("*").order("name");
      clubsError = error || null;
      if (!error) { clubs = data; mergeClubs(); }
    }

    const teamsHead = `<div class="ph"><div><h1>Teams &amp; Players</h1><p>Add teams, upload logos and keep squad lists up to date. Tap a logo to change it.</p></div>
      <div class="ph-act"><button class="btn primary" id="tm-add">${icon("plus")} Add team</button></div></div>`;

    async function loadTeamsPage() {
      app.innerHTML = teamsHead + `<p class="notice">Loading teams…</p>`;
      await loadClubs();
      if (page === "teams") renderTeamsPage();
    }

    function renderTeamsPage() {
      if (clubsError) {
        const missing = /does not exist|schema cache|42P01|PGRST205/i.test(clubsError.message + " " + clubsError.code);
        app.innerHTML = teamsHead + `<div class="card notice"><div class="big-ic">${icon("alert")}</div>
          <h2>${missing ? "One-time setup needed" : "Couldn't load teams"}</h2>
          <p>${missing ? "Open Supabase → SQL Editor and run <code>supabase/setup.sql</code> again (it now includes teams). Then reload this page." : esc(clubsError.message)}</p></div>`;
        return;
      }
      app.innerHTML = teamsHead + `
        <div class="card tm-table">
          <div class="tm-row tm-hd"><span>Team</span><span>Short</span><span>Manager</span><span>Players</span><span></span></div>
          ${clubs.length ? clubs.map(c => `
            <div class="tm-row">
              <span class="tm-name"><label class="tm-logo" title="Change ${esc(c.name)}'s logo">${teamLogo(c.name)}<span class="tm-cam">${icon("camera")}</span>
                <input type="file" accept="image/png,image/jpeg,image/webp" data-logo="${c.id}" hidden></label><b>${esc(c.name)}</b></span>
              <span class="tm-short">${esc(c.short || "—")}</span>
              <span class="tm-mgr">${esc(c.manager || "—")}</span>
              <span class="tm-pl"><b>${(c.players || []).length}</b><small> players</small></span>
              <span class="fx-act"><button class="btn" data-club="${c.id}">${icon("edit")} Edit</button></span>
            </div>`).join("")
          : `<div class="fx-empty">${icon("team")}<b>No teams yet</b><span>Add the first team.</span></div>`}
        </div>`;
      document.getElementById("tm-add").onclick = () => editClub(null);
      app.querySelectorAll("[data-logo]").forEach(inp => inp.onchange = async () => {
        const c = clubs.find(x => x.id === inp.dataset.logo), file = inp.files[0];
        if (!file) return;

    // Shrink a picked logo to at most 400 px (PNG keeps a transparent background)
    function shrinkLogo(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 400 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't read the image")), "image/png");
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => reject(new Error("That file isn't an image"));
        img.src = URL.createObjectURL(file);
      });
    }

    // ---------- Shared: uploads ----------
    // Photos are shrunk before upload (to `max` px on the long side); videos go up as they are
    function shrinkImage(file, max, type = "image/jpeg") {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't read the image")), type, .85);
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => reject(new Error("That file isn't an image"));
        img.src = URL.createObjectURL(file);
      });
    }
    async function uploadMedia(file, folder, { max = 1800, png = false } = {}) {
      const video = file.type.startsWith("video/");
      if (video && file.size > 50 * 1024 * 1024) throw new Error("Videos can be up to 50 MB. For longer videos, put them on YouTube and add the link.");
      const body = video ? file : await shrinkImage(file, max, png ? "image/png" : "image/jpeg");
      const ext = video ? (file.name.split(".").pop() || "mp4").toLowerCase() : png ? "png" : "jpg";
      const path = `${folder}/${crypto.randomUUID()}.${ext}`;
      const { error } = await db.storage.from("media").upload(path, body, { contentType: video ? file.type : png ? "image/png" : "image/jpeg" });
      if (error) throw error;
      return db.storage.from("media").getPublicUrl(path).data.publicUrl;
    }
    // Remove a file we uploaded earlier (links to other sites are left alone)
    function removeMedia(url) {
      const m = String(url || "").match(/\/storage\/v1\/object\/public\/media\/(.+)$/);
      if (m) db.storage.from("media").remove([decodeURIComponent(m[1])]);
    }

      app.innerHTML = galHead() + `
        <div class="gal-adm">
          <div class="seg left">${[["photo", "Photos", photos.length], ["video", "Videos", videos.length]].map(([k, l, n]) => `<button class="seg-b ${galTab === k ? "on" : ""}" data-gt="${k}">${l} <em>${n}</em></button>`).join("")}</div>
          ${galTab === "photo" ? `
          <label class="card drop" id="drop">${icon("camera")}<b>Add photos</b><span>Tap to choose, or drop photos here. You can pick many at once.</span>
            <input type="file" accept="image/*" multiple id="ph-files" hidden></label>
          <p class="hint" id="up-state"></p>
          <div class="ph-grid">${photos.map(g => `<div class="ph-cell"><img src="${esc(g.url)}" alt="" loading="lazy"><button class="icon-btn" data-rm="${g.id}" aria-label="Remove photo">${icon("trash")}</button></div>`).join("")}</div>
          ${photos.length ? "" : `<div class="card fx-empty big">${icon("camera")}<b>No photos yet</b></div>`}` : `
          <div class="card vid-add">
            <div class="vid-col"><h3>Upload a video from this device</h3><p class="hint">MP4 works best on every phone and computer. Up to 50 MB.</p>
              <div class="vid-in"><label class="btn file-btn">${icon("plus")} Choose video<input type="file" accept="video/mp4,video/webm,video/quicktime" id="vd-file" hidden></label><span class="hint" id="vd-name">No file chosen</span></div>
              <input id="vd-title1" placeholder="Title, e.g. Final highlights" maxlength="200"><button class="btn primary" id="vd-up" disabled>${icon("plus")} Upload video</button></div>
            <div class="vid-col"><h3>Or add a video link</h3><p class="hint">YouTube plays on the site. Facebook, TikTok and Instagram links open in a new tab.</p>
              <input id="vd-link" placeholder="https://youtu.be/…" autocomplete="off"><input id="vd-title2" placeholder="Title" maxlength="200"><button class="btn primary" id="vd-add">${icon("plus")} Add video</button></div>
          </div>
          <p class="hint" id="up-state"></p>
          <div class="card tm-table">${videos.length ? videos.map(g => `
            <div class="vd-row">${youtubeId(g.url) ? `<img src="https://i.ytimg.com/vi/${youtubeId(g.url)}/default.jpg" alt="">` : `<span class="nw-noimg">${icon("play")}</span>`}
              <input value="${esc(g.title || "")}" data-title="${g.id}" maxlength="200" aria-label="Title"><button class="btn" data-save="${g.id}">Save</button>
              <a class="vd-link" href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url.replace(/^https?:\/\//, "").slice(0, 40))}</a>
              <button class="btn danger" data-rm="${g.id}">${icon("trash")} Remove</button></div>`).join("") : `<div class="fx-empty">${icon("play")}<b>No videos yet</b></div>`}</div>`}
        </div>`;
      app.querySelectorAll("[data-gt]").forEach(b => b.onclick = () => { galTab = b.dataset.gt; app.innerHTML = ""; loadGallery(); });
      app.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
        const g = gal.find(x => x.id === b.dataset.rm);
        if (!confirm("Remove this " + g.kind + " from the gallery?")) return;
        const { error } = await db.from("gallery").delete().eq("id", g.id);
        if (error) return alert("Couldn't remove: " + error.message);
        removeMedia(g.url); loadGallery();
      });
      app.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
        const { error } = await db.from("gallery").update({ title: app.querySelector(`[data-title="${b.dataset.save}"]`).value.trim() || null }).eq("id", b.dataset.save);
        error ? alert("Couldn't save: " + error.message) : toast("✓ Title saved");
      });
      const state = msg => { const el = document.getElementById("up-state"); if (el) el.textContent = msg; };
      const addPhotos = async files => {
        files = [...files].filter(f => f.type.startsWith("image/"));
        for (let i = 0; i < files.length; i++) {
          state(`Uploading photo ${i + 1} of ${files.length}…`);
          try { const url = await uploadMedia(files[i], "gallery"); await db.from("gallery").insert({ kind: "photo", url }); }
          catch (x) { state("Couldn't upload " + files[i].name + ": " + x.message); return; }
        }
        toast(`✓ ${files.length} photo${files.length === 1 ? "" : "s"} added`); loadGallery();
      };
      const pf = document.getElementById("ph-files");
      if (pf) {
        pf.onchange = () => addPhotos(pf.files);
        const drop = document.getElementById("drop");
        drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
        drop.ondragleave = () => drop.classList.remove("over");
        drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addPhotos(e.dataTransfer.files); };
      }
      const vf = document.getElementById("vd-file");
      if (vf) {
        vf.onchange = () => { document.getElementById("vd-name").textContent = vf.files[0] ? vf.files[0].name : "No file chosen"; document.getElementById("vd-up").disabled = !vf.files[0]; };
        document.getElementById("vd-up").onclick = async () => {
          state("Uploading video… keep this page open");
          try { const url = await uploadMedia(vf.files[0], "gallery"); await db.from("gallery").insert({ kind: "video", url, title: document.getElementById("vd-title1").value.trim() || null }); }
          catch (x) { state("Couldn't upload: " + x.message); return; }
          toast("✓ Video added"); loadGallery();
        };
        document.getElementById("vd-add").onclick = async () => {
          const url = document.getElementById("vd-link").value.trim();
          if (!/^https?:\/\//i.test(url)) return state("Paste the full link, starting with https://");
          const { error } = await db.from("gallery").insert({ kind: "video", url, title: document.getElementById("vd-title2").value.trim() || null });
          if (error) return state("Couldn't add: " + error.message);
          toast("✓ Video added"); loadGallery();
        };
      }
    }

    // ---------- Sponsors ----------
    const LEVELS = ["Main Sponsor", "Gold Sponsor", "Silver Sponsor", "Partner", "Media Partner"];
    let sps = [];
    const spHead = () => pageHead("Sponsors", "Logos are grouped by level on the website. Lower “Order” numbers show first within a level.",
      `<a class="btn" href="./#sponsors" target="_blank" rel="noopener">${icon("external")} View page</a>`);
    async function loadSponsors() {
      app.innerHTML = spHead() + `<p class="notice">Loading sponsors…</p>`;
      const { data, error } = await db.from("sponsors").select("*").order("sort").order("name");
      if (page !== "sponsors") return;
      if (error) return setupNeeded(spHead(), error);
      sps = data;
      const card = (s, isNew) => `
        <form class="card sp-card ${isNew ? "new" : ""}" data-sp="${isNew ? "" : s.id}">
          <div class="sp-top"><span class="sp-prev">${s.logo ? `<img src="${esc(s.logo)}" alt="">` : icon("camera")}</span>
            <div class="logo-btns"><label class="btn file-btn">${icon("plus")} ${s.logo ? "Change logo" : "Choose logo"}<input type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
              <small class="hint">PNG with a transparent background looks best.</small></div></div>
          <label>Name <small>(optional, shown under the logo)</small><input name="name" maxlength="100" value="${esc(s.name || "")}"></label>
          <div class="g2"><label>Level<select name="level">${LEVELS.map(l => `<option ${s.level === l ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            <label>Order<input name="sort" type="number" value="${s.sort ?? 0}"></label></div>
          <label>Website<input name="website" maxlength="300" placeholder="www.example.mv" value="${esc(s.website || "")}"></label>
          ${isNew ? "" : `<label class="fx-check"><input type="checkbox" name="visible" ${s.visible ? "checked" : ""}> Show on the website</label>`}
          <div class="sp-act">${isNew ? "" : `<button type="button" class="btn danger" data-sprm>${icon("trash")} Remove</button>`}<span class="sp"></span>
            <button class="btn primary" type="submit">${icon(isNew ? "plus" : "check")} ${isNew ? "Add sponsor" : "Save"}</button></div>
        </form>`;
      app.innerHTML = spHead() + `<div class="sp-grid">${card({ level: "Partner", sort: 0, visible: true }, true)}${sps.map(s => card(s, false)).join("")}</div>`;
      app.querySelectorAll(".sp-card").forEach(f => {
        const s = sps.find(x => x.id === f.dataset.sp) || null;
        let file = null;
        f.querySelector("input[type=file]").onchange = e => { file = e.target.files[0]; if (file) f.querySelector(".sp-prev").innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`; };
        const rm = f.querySelector("[data-sprm]");
        if (rm) rm.onclick = async () => {
          if (!confirm("Remove this sponsor?")) return;
          const { error } = await db.from("sponsors").delete().eq("id", s.id);
          if (error) return alert("Couldn't remove: " + error.message);
          removeMedia(s.logo); loadSponsors();
        };
        f.onsubmit = async e => {
          e.preventDefault();
          if (!s && !file && !f.name.value.trim()) return alert("Choose a logo or enter a name.");
          const btn = f.querySelector("[type=submit]"); btn.disabled = true;
          let logo = s ? s.logo : null;
          try { if (file) logo = await uploadMedia(file, "sponsors", { max: 600, png: true }); }
          catch (x) { btn.disabled = false; return alert("Couldn't upload the logo: " + x.message); }
          const row = { name: f.name.value.trim() || null, level: f.level.value, sort: Number(f.sort.value) || 0, website: f.website.value.trim() || null, logo,
                        visible: s ? f.visible.checked : true };
          const { error } = s ? await db.from("sponsors").update(row).eq("id", s.id) : await db.from("sponsors").insert(row);
          btn.disabled = false;
          if (error) return alert("Couldn't save: " + error.message);
          if (s && file && s.logo) removeMedia(s.logo);
          toast(s ? "✓ Sponsor saved" : "✓ Sponsor added"); loadSponsors();
        };
      });
    }

    // ---------- Users & roles ----------
    const PERMS = [
      ["dashboard", "Dashboard: website visitors and the overview"],
      ["registrations", "Registrations: teams, ID photos, open or close registration"],
      ["fixtures", "Fixtures & results: matches, scores, goals and videos"],
      ["teams", "Teams: add teams, upload logos, edit squads"],
      ["news", "News: write stories and choose the slider"],
      ["gallery", "Gallery: photos and videos"],
      ["sponsors", "Sponsors: sponsor logos"],
      ["users", "Users & roles: add organisers and choose what they can do"],
      ["settings", "Site settings: the website's logos"]
    ];
    let people = [], roleList = [];
    async function loadPeople() {
      const [o, r] = await Promise.all([db.from("organisers").select("email,name,role").order("email"), db.from("roles").select("*").order("name")]);
      return o.error || r.error || (people = o.data, roleList = r.data, null);
    }
    const shownLogin = em => em.endsWith("@phone.ypveterans.com") ? "+" + em.slice(0, 3) + " " + em.slice(3, em.indexOf("@")) : em;

    const usersHead = () => pageHead("Users", "Organisers who can sign in to this portal, and what each can do.",
      `<a class="btn" href="#roles">${icon("shield")} User roles</a><button class="btn primary" id="us-add">${icon("plus")} Add user</button>`);
    async function loadUsers() {
      app.innerHTML = usersHead() + `<p class="notice">Loading users…</p>`;
      const err = await loadPeople();
      if (page !== "users") return;
      if (err) return setupNeeded(usersHead(), err);
      app.innerHTML = usersHead() + `
        <div class="card tm-table">
          <div class="us-row tm-hd"><span>Name</span><span>Email or phone</span><span>Role</span><span></span></div>
          ${people.map(u => `<div class="us-row">
            <span class="tm-name"><span class="tl tl-i">${esc(initials(u.name || u.email))}</span><b>${esc(u.name || "—")}</b>${u.email.toLowerCase() === me.email.toLowerCase() ? `<span class="you">You</span>` : ""}</span>
            <span class="tm-mgr">${esc(shownLogin(u.email))}</span>
            <span><span class="pill ${u.role === "Super Admin" ? "rejected" : "confirmed"}">${esc(u.role || "Super Admin")}</span></span>
            <span class="fx-act"><button class="btn" data-user="${esc(u.email)}">${icon("edit")} Edit</button></span></div>`).join("")}
        </div>`;
      document.getElementById("us-add").onclick = () => editUser(null);
      app.querySelectorAll("[data-user]").forEach(b => b.onclick = () => editUser(people.find(u => u.email === b.dataset.user)));
    }
    function editUser(u) {
      const isNew = !u;
      u = u || { email: "", name: "", role: roleList.find(r => r.name === "Administrator") ? "Administrator" : roleList[0].name };
      const self = !isNew && u.email.toLowerCase() === me.email.toLowerCase();
      fxDlg.innerHTML = `
        <form class="sheet-in" id="us-form" novalidate>
          <div class="sheet-h"><div><h2>${isNew ? "Add user" : "Edit user"}</h2><p>${isNew ? "New organiser" : esc(shownLogin(u.email))}</p></div>
            <button type="button" class="icon-btn" id="sh-close" aria-label="Close">${icon("x")}</button></div>
          <div class="sheet-b">
            <fieldset class="fs"><legend>User</legend>
              <label>Name<input name="name" maxlength="100" value="${esc(u.name || "")}"></label>
              <label>Email or phone number<input name="login" ${isNew ? "" : "disabled"} value="${esc(isNew ? "" : shownLogin(u.email))}" placeholder="name@example.com or 7XX XXXX" autocomplete="off"></label>
              <label>Role<select name="role" ${self ? "disabled" : ""}>${roleList.map(r => `<option ${r.name === u.role ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
              ${self ? `<small class="hint">You can't change your own role.</small>` : ""}
            </fieldset>
            ${isNew ? `<div class="card note">${icon("alert")}<div><b>They also need a password</b>
              <p>In Supabase open <b>Authentication → Users → Add user</b>, enter the same email (or for a phone number: <code>960XXXXXXX@phone.ypveterans.com</code>) and a password, and tick “Auto Confirm User”. Then give them the password.</p></div></div>` : ""}
            <p class="form-error" id="sh-err" role="alert"></p>
          </div>
          <div class="sheet-f">${isNew || self ? "" : `<button type="button" class="btn danger" id="sh-del">${icon("trash")} Remove</button>`}<span class="sp"></span>
            <button type="button" class="btn" id="sh-cancel">Cancel</button><button type="submit" class="btn primary">${icon("check")} ${isNew ? "Add user" : "Save"}</button></div>
        </form>`;
      const f = document.getElementById("us-form");
      wireSheet(async () => {
        if (u.role === "Super Admin" && people.filter(x => x.role === "Super Admin").length < 2) { alert("This is the only Super Admin, so it can't be removed."); return false; }
        if (!confirm(`Remove ${u.name || shownLogin(u.email)}? They won't be able to use the portal any more.`)) return false;
        const { error } = await db.from("organisers").delete().eq("email", u.email);
        if (error) { alert("Couldn't remove: " + error.message); return false; }
        toast("User removed"); loadUsers(); return true;
      });
      f.onsubmit = async e => {
        e.preventDefault();
        const err = document.getElementById("sh-err");
        const row = { name: f.name.value.trim() || null, role: f.role.value };
        if (self) delete row.role;
        if (!isNew && u.role === "Super Admin" && row.role && row.role !== "Super Admin" && people.filter(x => x.role === "Super Admin").length < 2) { err.textContent = "Keep at least one Super Admin."; return; }
        let res;
        if (isNew) {
          if (!f.login.value.trim()) { err.textContent = "Enter an email or phone number."; return; }
          row.email = loginEmail(f.login.value).toLowerCase();
          if (people.some(x => x.email.toLowerCase() === row.email)) { err.textContent = "That user is already on the list."; return; }
          res = await db.from("organisers").insert(row);
        } else res = await db.from("organisers").update(row).eq("email", u.email);
        if (res.error) { err.textContent = "Couldn't save: " + res.error.message; return; }
        fxDlg.close(); toast(isNew ? "✓ User added" : "✓ User saved"); loadUsers();
      };
      fxDlg.showModal();
    }

    const rolesHead = () => pageHead("User Roles", "A role is a set of permissions. Give each user the role that matches their job.",
      `<a class="btn" href="#users">${icon("users")} Users</a><button class="btn primary" id="rl-add">${icon("plus")} New role</button>`);
    async function loadRoles() {
      app.innerHTML = rolesHead() + `<p class="notice">Loading roles…</p>`;
      const err = await loadPeople();
      if (page !== "roles") return;
      if (err) return setupNeeded(rolesHead(), err);
      roleList.sort((a, b) => (b.name === "Super Admin") - (a.name === "Super Admin") || a.name.localeCompare(b.name));
      app.innerHTML = rolesHead() + `<div class="rl-grid">${roleList.map(r => {
        const n = people.filter(u => u.role === r.name).length, sup = r.name === "Super Admin";
        return `<form class="card rl-card" data-role="${esc(r.name)}">
          <div class="rl-h"><input name="name" value="${esc(r.name)}" maxlength="40" ${sup ? "disabled" : ""} aria-label="Role name"><span class="d-pill">${n} user${n === 1 ? "" : "s"}</span></div>
          ${sup ? `<p class="rl-note">Super Admin always has every permission.</p>` : ""}
          ${PERMS.map(([k, l]) => `<label class="fx-check"><input type="checkbox" name="p" value="${k}" ${sup || r.perms.includes(k) ? "checked" : ""} ${sup ? "disabled" : ""}> ${esc(l)}</label>`).join("")}
          ${sup ? "" : `<div class="sp-act">${n ? "" : `<button type="button" class="btn danger" data-rlrm>${icon("trash")} Delete</button>`}<span class="sp"></span><button class="btn primary" type="submit">${icon("check")} Save role</button></div>`}
        </form>`; }).join("")}</div>`;
      document.getElementById("rl-add").onclick = async () => {
        const name = (prompt("Name of the new role, e.g. Scorekeeper") || "").trim();
        if (!name) return;
        if (roleList.some(r => r.name.toLowerCase() === name.toLowerCase())) return alert("There's already a role with that name.");
        const { error } = await db.from("roles").insert({ name: name.slice(0, 40), perms: [] });
        if (error) return alert("Couldn't add: " + error.message);
        loadRoles();
      };
      app.querySelectorAll(".rl-card").forEach(f => {
        const r = roleList.find(x => x.name === f.dataset.role);
        const rm = f.querySelector("[data-rlrm]");
        if (rm) rm.onclick = async () => {
          if (!confirm(`Delete the role “${r.name}”?`)) return;
          const { error } = await db.from("roles").delete().eq("name", r.name);
          if (error) return alert("Couldn't delete: " + error.message);
          loadRoles();
        };
        f.onsubmit = async e => {
          e.preventDefault();
          const name = f.name.value.trim();
          if (!name) return alert("Give the role a name.");
          const perms = [...f.querySelectorAll("[name=p]:checked")].map(x => x.value);
          const { error } = await db.from("roles").update({ name, perms }).eq("name", r.name);
          if (error) return alert("Couldn't save: " + error.message);
          toast("✓ Role saved"); loadRoles();
        };
      });
    }

    // ---------- Site Settings: the website's logos ----------
    const LOGOS = [
      ["site_logo", "Tournament logo", "In the menu bar at the top of every page.", "images/veterans-logo.jpg"],
      ["club_logo", "Club crest", "Young Players SC, in the footer at the bottom.", "images/yp-logo.jpg"]
    ];
    async function loadSiteSettings() {
      const head = pageHead("Site Settings", "The logos the website shows. Changes appear as soon as you save.",
        `<a class="btn" href="./" target="_blank" rel="noopener">${icon("external")} View website</a>`);
      app.innerHTML = head + `<p class="notice">Loading…</p>`;
      const { data, error } = await db.from("settings").select("site_logo, club_logo").eq("id", 1).single();
      if (page !== "site") return;
      if (error) return setupNeeded(head, error);
      app.innerHTML = head + `<div class="sp-grid">${LOGOS.map(([k, title, where, def]) => `
        <form class="card sp-card" data-k="${k}">
          <div class="d-h"><div><h2>${title}</h2><span>${where}</span></div>${data[k] ? "" : `<span class="d-pill">Default</span>`}</div>
          <div class="sp-top"><span class="logo-prev"><img src="${esc(data[k] || def)}" alt=""></span>
            <div class="logo-btns"><label class="btn file-btn">${icon("plus")} Choose new logo<input type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
              <small class="hint">Square images work best. PNG keeps a transparent background.</small></div></div>
          <div class="sp-act">${data[k] ? `<button type="button" class="btn danger" data-reset>${icon("undo")} Back to default</button>` : ""}<span class="sp"></span>
            <button class="btn primary" type="submit" disabled>${icon("check")} Save logo</button></div>
        </form>`).join("")}</div>`;
      app.querySelectorAll("[data-k]").forEach(f => {
        const k = f.dataset.k;
        let file = null;
        f.querySelector("input[type=file]").onchange = e => {
          file = e.target.files[0];
          if (!file) return;
          f.querySelector(".logo-prev").innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`;
          f.querySelector("[type=submit]").disabled = false;
        };
        const save = async value => {
          const { error } = await db.from("settings").update({ [k]: value, updated_at: new Date().toISOString() }).eq("id", 1);
          if (error) return alert("Couldn't save: " + error.message);
          if (data[k] && data[k] !== value) removeMedia(data[k]);
          toast(value ? "✓ Logo saved" : "Logo back to default");
          loadSiteSettings();
        };
        f.onsubmit = async e => {
          e.preventDefault();
          const btn = f.querySelector("[type=submit]"); btn.disabled = true;
          try { save(await uploadMedia(file, "site", { max: 512, png: true })); }
          catch (x) { btn.disabled = false; alert("Couldn't upload: " + x.message); }
        };
        const reset = f.querySelector("[data-reset]");
        if (reset) reset.onclick = () => { if (confirm("Go back to the original logo?")) save(null); };
      });
    }

    // ---------- App (install on the home screen) ----------
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("admin-sw.js", { scope: "./admin.html" }).catch(() => {});
    const isApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let installPrompt = null;
    // Show the Install buttons when the browser can install, or on iPhone/iPad (Add to Home Screen)
    const showInstall = () => document.querySelectorAll("[data-install]").forEach(b => {
      b.hidden = isApp || !(installPrompt || isIOS);
      b.onclick = async () => {
        if (installPrompt) {
          installPrompt.prompt();
          const { outcome } = await installPrompt.userChoice;
          if (outcome === "accepted") { installPrompt = null; showInstall(); }
        } else {
          alert("To install the app on your iPhone or iPad:\n\n1. Tap the Share button (square with an arrow) in Safari\n2. Choose “Add to Home Screen”\n3. Tap “Add”\n\nThe YP Organiser icon will appear on your home screen.");
        }
      };
    });
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; showInstall(); });
    addEventListener("appinstalled", () => { installPrompt = null; showInstall(); toast("✓ YP Organiser app installed"); });
    new MutationObserver(showInstall).observe(app, { childList: true });
    showInstall();

    start();
  </script>
</body>
</html>
